<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Бизнес-ошибка')}"></head>
<body>

<div class="ap-page">
    <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
        <div style="text-align:center;max-width:420px">

            <div style="font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1">
                Ошибка
            </div>

            <div class="ap-page-head" style="margin:12px 0 0">
                <h1>Бизнес-ошибка</h1>
            </div>

            <p class="ap-muted" style="margin-top:10px"
               th:text="${errorMessage} ?: 'Невозможно выполнить операцию'">
                Невозможно выполнить операцию
            </p>

            <div class="ap-cluster" style="justify-content:center;margin-top:24px">
                <button type="button" class="ap-btn ap-btn-outline" onclick="history.back()">
                    <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                    Вернуться назад
                </button>
                <a th:href="@{/home}" class="ap-btn ap-btn-dark">На главную</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
