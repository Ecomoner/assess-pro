<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Доступ запрещён')}"></head>
<body>

<div class="ap-page">
    <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
        <div style="text-align:center;max-width:420px">

            <div style="font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1">
                403
            </div>

            <div class="ap-page-head" style="margin:12px 0 0">
                <h1>Доступ запрещён</h1>
            </div>

            <p class="ap-muted" style="margin-top:10px">
                У вас недостаточно прав для доступа к этой странице.
                Пожалуйста, обратитесь к администратору системы.
            </p>

            <div class="ap-cluster" style="justify-content:center;margin-top:24px">
                <a th:href="@{/home}" class="ap-btn ap-btn-dark">
                    <svg th:replace="~{fragments/icons :: i-dashboard}"></svg>
                    На главную
                </a>
                <a th:href="@{/dashboard}" class="ap-btn ap-btn-outline">В панель управления</a>
                <form th:action="@{/logout}" method="post">
                    <input th:if="${_csrf != null}" type="hidden"
                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="ap-btn ap-btn-ghost">Выйти</button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
