<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Материалы для изучения')}"></head>
<body>

<!--
    /materials требует аутентификации (SecurityConfig: anyRequest().authenticated()),
    поэтому страница рендерится в общем shell с sidebar.

    Особенность: на этой странице сайдбар работает как оглавление.
    Список разделов передаётся в фрагмент sidebar через th:with —
    фрагмент видит переменную sidebarSections и переключается в режим
    «только материалы»: переходы по приложению скрыты, вместо них
    кнопка «Назад» и список разделов.

    Материалы только для просмотра: без кнопок скачивания, имён файлов,
    размеров и счётчиков.
-->
<div class="ap-page ap-shell"
     th:with="role=${#authentication != null and #authentication.isAuthenticated()
                    ? #strings.replace(#authentication.authorities.iterator().next().authority, 'ROLE_', '')
                    : 'TESTER'},
              sidebarSections=${sections}">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar в режиме оглавления -->
    <aside th:replace="~{fragments/sidebar :: sidebar(${role}, 'materials')}"></aside>

    <main class="ap-main" id="materialsTop">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Материалы для изучения</h1>
        </div>

        <th:block th:if="${sections != null and !#lists.isEmpty(sections)}">

            <!-- Разделы. Виден всегда один; переключение — из сайдбара.
                 Первый показан сразу (на случай, если JS не выполнится). -->
            <div th:each="section, iter : ${sections}"
                 class="ap-section-view"
                 th:id="'sec-' + ${section.id}"
                 th:style="${iter.first} ? '' : 'display:none'"
                 role="tabpanel">

                <div class="ap-card">
                    <div class="ap-card-head">
                        <h3 th:text="${section.title}">Раздел</h3>
                    </div>

                    <div class="ap-card-body">

                        <p class="ap-small ap-muted" style="margin-bottom:16px"
                           th:if="${section.description}"
                           th:text="${section.description}">Описание раздела</p>

                        <!-- Материалы раздела: чистый просмотр -->
                        <div th:each="material : ${section.materials}">

                            <!-- Видео -->
                            <div th:if="${material.type == 'VIDEO_FILE'}" class="ap-media ap-media-video">
                                <video controls controlsList="nodownload"
                                       disablepictureinpicture
                                       preload="metadata">
                                    <source th:src="@{/materials/video/{id}(id=${material.id})}"
                                            th:type="${material.contentType}">
                                    Ваш браузер не поддерживает видео.
                                </video>
                            </div>

                            <!-- PDF -->
                            <div th:if="${material.type == 'PDF'}" class="ap-media ap-media-doc">
                                <!-- pdf.js вставляет <canvas> внутрь этого контейнера -->
                                <div class="pdf-container"
                                     th:attr="data-pdf-url=@{/materials/pdf/{id}(id=${material.id})}"></div>
                            </div>

                        </div>

                        <!-- Связанные тесты: без заголовка, просто ссылки под чертой -->
                        <div th:if="${section.tests != null and !#lists.isEmpty(section.tests)}"
                             class="ap-media-tests">
                            <a th:each="test : ${section.tests}"
                               class="ap-btn ap-btn-outline ap-btn-sm"
                               th:href="@{/tester/test/{id}/start(id=${test.id})}"
                               th:text="${test.title}">Тест</a>
                        </div>

                    </div>
                </div>

            </div>

        </th:block>

        <!-- Пустое состояние -->
        <div class="ap-empty" th:if="${sections == null or #lists.isEmpty(sections)}">
            <svg th:replace="~{fragments/icons :: i-materials}"></svg>
            <div>Материалы пока не добавлены.</div>
        </div>

    </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script th:inline="javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    function loadPdf(container, url) {
        pdfjsLib.getDocument(url).promise.then(function (pdf) {
            container.innerHTML = '';
            var chain = Promise.resolve();
            for (var i = 1; i <= pdf.numPages; i++) {
                chain = chain.then(function (pageNum) {
                    return pdf.getPage(pageNum).then(function (page) {
                        var viewport = page.getViewport({ scale: 1.25 });
                        var canvas = document.createElement('canvas');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        container.appendChild(canvas);
                        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    });
                }.bind(null, i));
            }
        }).catch(function () {
            container.innerHTML = '<p style="padding:12px;color:var(--ap-muted)">Не удалось загрузить документ.</p>';
        });
    }

    document.addEventListener('DOMContentLoaded', function () {

        var side    = document.getElementById('apSide');
        var focus   = document.querySelector('.ap-side-focus');
        var backBtn = document.getElementById('apSideBack');
        var topBtn  = document.getElementById('apMaterialsTop');
        var subBtns = document.querySelectorAll('.ap-side-sections .ap-nav-sub');
        var panels  = document.querySelectorAll('.ap-section-view');

        // Страница материалов открывается сразу в режиме оглавления
        if (focus && side) { side.classList.add('ap-focus-mode'); }

        function scrollTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSection(id, doScroll) {
            var target = document.getElementById('sec-' + id);
            if (!target) return;

            panels.forEach(function (p) {
                p.style.display = (p === target) ? 'block' : 'none';
            });

            subBtns.forEach(function (b) {
                b.classList.toggle('ap-active', b.getAttribute('data-section') === String(id));
            });

            // ленивая загрузка PDF в показанном разделе
            var doc = target.querySelector('.pdf-container');
            if (doc && !doc.classList.contains('loaded')) {
                var url = doc.getAttribute('data-pdf-url');
                if (url) { loadPdf(doc, url); doc.classList.add('loaded'); }
            }

            if (doScroll) { scrollTop(); }
            if (history.replaceState) { history.replaceState(null, null, '#sec-' + id); }
        }

        subBtns.forEach(function (b) {
            b.addEventListener('click', function () {
                showSection(this.getAttribute('data-section'), true);
            });
        });

        // «Назад» — вернуть обычную навигацию по приложению
        if (backBtn) {
            backBtn.addEventListener('click', function () {
                if (side) { side.classList.remove('ap-focus-mode'); }
            });
        }

        // Возврат в режим оглавления без перезагрузки: клик по «Материалы»
        // в обычной навигации снова разворачивает разделы.
        document.querySelectorAll('.ap-side-full a.ap-nav-item').forEach(function (a) {
            var href = a.getAttribute('href') || '';
            if (/\/materials$/.test(href)) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (side) { side.classList.add('ap-focus-mode'); }
                    scrollTop();
                });
            }
        });

        // «Материалы» — наверх и первый раздел
        if (topBtn) {
            topBtn.addEventListener('click', function () {
                scrollTop();
                if (panels.length) {
                    showSection(panels[0].id.replace('sec-', ''), false);
                }
            });
        }

        // Начальный раздел: из хэша либо первый
        var hash = window.location.hash ? window.location.hash.substring(1).replace('sec-', '') : null;
        var initial = (hash && document.getElementById('sec-' + hash))
            ? hash
            : (panels.length ? panels[0].id.replace('sec-', '') : null);
        if (initial) { showSection(initial, false); }
    });
</script>
<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
