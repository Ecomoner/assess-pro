<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============================================
     headerModern(title) — единственная шапка проекта.

     Раньше здесь был второй фрагмент header(title)
     с Bootstrap Icons и Font Awesome, но его не
     подключала ни одна страница, поэтому он удалён.
     ============================================ -->
<head th:fragment="headerModern(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fafafa">
    <title th:text="${title}"></title>

    <!-- CSRF-токен для JS (fetch / jQuery / htmx / динамические формы).
         Пока CSRF на сервере выключен, content будет пустым и js/csrf.js
         просто ничего не сделает. -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf?.parameterName}">

    <!--
        Внешние библиотеки намеренно НЕ подключаются:
        - htmx не используется (нет ни одного hx-*), а unpkg.com не резолвится
          и вешал парсинг страницы на ~11 секунд;
        - jQuery не используется (весь JS переписан на ванильный);
        - Bootstrap CSS не используется (все классы — ap-*, модалки нативные
          <dialog>), а его reboot перебивался нашим сбросом.

        Шрифт Inter грузим неблокирующе: сначала страница рисуется
        системным шрифтом (он прописан в assesspro-ui.css как fallback),
        затем подменяется. Так недоступность Google Fonts не тормозит
        первую отрисовку.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <noscript>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    </noscript>

    <!-- CSRF-обвязка: должна подключиться до скриптов страниц -->
    <script defer th:src="@{/js/csrf.js}"></script>

    <!-- Новый CSS -->
    <link th:href="@{/css/assesspro-ui.css}" rel="stylesheet">
</head>

</html>
