<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Управление пользователями')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'users')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Управление пользователями</h1>
            <p th:text="${(totalItems != null ? totalItems : 0) + ' пользователей'}">0 пользователей</p>
        </div>

        <!-- Сообщения -->
        <div th:if="${successMessage}" class="ap-alert"
             style="background:#f0fdf4;color:#166534;border-color:#dcfce7">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>
        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;color:#b91c1c;border-color:#fecaca">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <!-- Фильтры и действия -->
        <div class="ap-toolbar">

            <form method="get" th:action="@{/admin/users}" class="ap-cluster">

                <div class="ap-search" style="flex:1 1 200px;max-width:260px">
                    <svg th:replace="~{fragments/icons :: i-search}"></svg>
                    <input type="search" name="search" th:value="${search}"
                           placeholder="Имя, логин..." aria-label="Поиск пользователей">
                </div>

                <select class="ap-select" name="role" aria-label="Роль" style="width:auto;min-width:150px">
                    <option value="">Все роли</option>
                    <option value="ROLE_ADMIN" th:selected="${role == 'ROLE_ADMIN'}">Администратор</option>
                    <option value="ROLE_CREATOR" th:selected="${role == 'ROLE_CREATOR'}">Создатель</option>
                    <option value="ROLE_TESTER" th:selected="${role == 'ROLE_TESTER'}">Тестировщик</option>
                    <option value="ROLE_MANAGER" th:selected="${role == 'ROLE_MANAGER'}">Менеджер</option>
                </select>

                <select class="ap-select" name="active" aria-label="Статус" style="width:auto;min-width:142px">
                    <option value="">Все статусы</option>
                    <option value="true" th:selected="${active == true}">Активен</option>
                    <option value="false" th:selected="${active == false}">Неактивен</option>
                </select>

                <select class="ap-select" name="size" aria-label="Размер страницы" style="width:auto;min-width:86px">
                    <option value="20" th:selected="${pageSize == 20}">20</option>
                    <option value="50" th:selected="${pageSize == 50}">50</option>
                    <option value="100" th:selected="${pageSize == 100}">100</option>
                </select>

                <button type="submit" class="ap-btn ap-btn-dark ap-btn-sm">
                    <svg th:replace="~{fragments/icons :: i-filter}"></svg>
                    Применить
                </button>

                <a th:href="@{/admin/users}" class="ap-btn ap-btn-ghost ap-btn-sm">Сброс</a>

            </form>

            <div class="ap-cluster">

                <form method="post" th:action="@{/admin/users/export}" data-export>
                    <input type="hidden" name="role" th:if="${role != null and !#strings.isEmpty(role)}" th:value="${role}">
                    <input type="hidden" name="active" th:if="${active != null}" th:value="${active}">
                    <button type="submit" class="ap-btn ap-btn-outline ap-btn-sm">
                        <svg th:replace="~{fragments/icons :: i-download}"></svg>
                        Экспорт
                    </button>
                </form>

                <a th:href="@{/admin/users/new}" class="ap-btn ap-btn-dark ap-btn-sm">
                    <svg th:replace="~{fragments/icons :: i-plus}"></svg>
                    Добавить
                </a>

            </div>

        </div>

        <!-- Таблица пользователей -->
        <div class="ap-table-card ap-stack-mobile">
            <table>
                <thead>
                <tr>
                    <th scope="col">Пользователь</th>
                    <th scope="col">Роль</th>
                    <th scope="col">Статус</th>
                    <th scope="col">Создан</th>
                    <th scope="col" class="ap-td-actions"><span class="ap-visually-hidden">Действия</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">

                    <td data-label="Пользователь">
                        <div>
                            <div class="ap-cell-title" th:text="${user.username}">user</div>
                            <div class="ap-cell-sub" th:text="${user.fullName} ?: '—'">Иванов И. И.</div>
                        </div>
                    </td>

                    <td data-label="Роль">
                        <span class="ap-tag" th:if="${user.role == 'ROLE_ADMIN'}">Администратор</span>
                        <span class="ap-tag" th:if="${user.role == 'ROLE_CREATOR'}">Создатель</span>
                        <span class="ap-tag" th:if="${user.role == 'ROLE_TESTER'}">Тестировщик</span>
                        <span class="ap-tag" th:if="${user.role == 'ROLE_MANAGER'}">Менеджер</span>
                    </td>

                    <td data-label="Статус">
                        <div class="ap-cluster">
                            <span class="ap-tag ap-ok" th:if="${user.isActive}">
                                <span class="ap-dot-sm"></span>Активен
                            </span>
                            <span class="ap-tag ap-neutral" th:unless="${user.isActive}">
                                <span class="ap-dot-sm"></span>Неактивен
                            </span>
                            <span class="ap-tag ap-neutral"
                                  th:text="${user.isProfileComplete} ? 'Профиль заполнен' : 'Профиль не заполнен'">Профиль</span>
                        </div>
                    </td>

                    <td data-label="Создан" class="ap-date"
                        th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd.MM.yy') : '—'}">—</td>

                    <td data-label="Действия" class="ap-td-actions">
                        <div class="ap-cluster" style="justify-content:flex-end">

                            <a th:href="@{/admin/users/{id}(id=${user.id})}"
                               class="ap-btn ap-btn-icon ap-btn-sm" title="Просмотр" aria-label="Просмотр">
                                <svg th:replace="~{fragments/icons :: i-eye}"></svg>
                            </a>

                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                               class="ap-btn ap-btn-icon ap-btn-sm" title="Редактировать" aria-label="Редактировать">
                                <svg th:replace="~{fragments/icons :: i-edit}"></svg>
                            </a>

                            <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post"
                                  style="display:inline">
                                <input type="hidden" name="active" th:value="${!user.isActive}">
                                <button type="submit" class="ap-btn ap-btn-icon ap-btn-sm"
                                        th:title="${user.isActive} ? 'Деактивировать' : 'Активировать'"
                                        th:aria-label="${user.isActive} ? 'Деактивировать' : 'Активировать'">
                                    <svg th:replace="~{fragments/icons :: i-refresh}"></svg>
                                </button>
                            </form>

                            <button type="button" class="ap-btn ap-btn-icon ap-btn-sm js-delete-user"
                                    title="Удалить" aria-label="Удалить"
                                    th:attr="data-username=${user.username},
                                             data-action=@{/admin/users/delete/{id}(id=${user.id})}">
                                <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                            </button>

                        </div>
                    </td>
                </tr>

                <tr th:if="${users == null or #lists.isEmpty(users)}">
                    <td colspan="5" class="ap-empty-row" data-label="Пусто">Пользователи не найдены</td>
                </tr>
                </tbody>
            </table>

            <!-- Пагинация внутри карточки, вне таблицы -->
            <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/admin/users', ${search}, null, ${pageSize})}"></div>
        </div>

    </main>

</div>

<!-- Подтверждение удаления: нативный <dialog>, без Bootstrap-модалок -->
<dialog class="ap-dialog" id="deleteUserDialog">
    <div class="ap-dialog-head">Удалить пользователя?</div>
    <div class="ap-dialog-body">
        Пользователь <strong id="deleteUserName"></strong> будет удалён безвозвратно.
    </div>
    <div class="ap-dialog-foot">
        <button type="button" class="ap-btn ap-btn-outline" id="deleteUserCancel">Отмена</button>
        <form method="post" id="deleteUserForm" style="display:inline">
            <button type="submit" class="ap-btn ap-btn-danger">Удалить</button>
        </form>
    </div>
</dialog>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    // Экспорт: POST-форма возвращает JSON с requestId.
    (function () {
        function toast(text) {
            var stack = document.getElementById('apToastStack');
            if (!stack) return;
            var el = document.createElement('div');
            el.className = 'ap-toast';
            el.textContent = text;
            stack.appendChild(el);
            setTimeout(function () { el.remove(); }, 6000);
        }

        document.querySelectorAll('form[data-export]').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                var body = new URLSearchParams(new FormData(form));
                fetch(form.getAttribute('action'), {
                    method: 'POST',
                    body: body,
                    headers: { 'Accept': 'application/json' }
                })
                    .then(function (response) {
                        if (!response.ok) throw new Error('export');
                        return response.json();
                    })
                    .then(function (data) { toast(data.message || 'Отчёт формируется'); })
                    .catch(function () { toast('Не удалось запустить экспорт'); });
            });
        });
    })();

    // Удаление пользователя через нативный диалог
    (function () {
        var dialog = document.getElementById('deleteUserDialog');
        if (!dialog) return;

        var form = document.getElementById('deleteUserForm');
        var nameEl = document.getElementById('deleteUserName');
        var cancel = document.getElementById('deleteUserCancel');

        document.querySelectorAll('.js-delete-user').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (nameEl) nameEl.textContent = btn.getAttribute('data-username') || '';
                if (form) form.setAttribute('action', btn.getAttribute('data-action') || '');
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
            });
        });

        if (cancel) {
            cancel.addEventListener('click', function () { dialog.close(); });
        }
    })();
</script>
</body>
</html>
