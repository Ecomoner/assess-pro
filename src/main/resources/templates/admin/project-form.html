<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern(${project.id == null ? 'Новый проект' : 'Редактирование проекта'})}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'projects')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/admin/projects}">Проекты</a>
            <span class="sep">/</span>
            <span class="cur" th:text="${project.id == null ? 'Создание' : 'Редактирование'}">Создание</span>
        </nav>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1 th:text="${project.id == null ? 'Создание нового проекта' : 'Редактирование проекта'}">
                Создание проекта
            </h1>
            <p>Название, менеджер и доступность проекта.</p>
        </div>

        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;color:#b91c1c;border-color:#fecaca">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <!-- Форма -->
        <div class="ap-card">

            <div class="ap-card-head">
                <h3>Данные проекта</h3>
            </div>

            <div class="ap-card-body" style="padding-top:20px;padding-bottom:22px">

                <form th:action="@{${formAction}}" method="post">

                    <div class="ap-form-grid">

                        <div class="ap-field ap-span-2">
                            <label class="ap-label" for="name">Название <span class="req">*</span></label>
                            <input type="text" class="ap-input" id="name" name="name"
                                   th:value="${project.name}" required>
                            <span class="ap-hint">Название должно быть уникальным</span>
                        </div>

                        <!-- Менеджер выбирается при создании; у существующего проекта
                             он назначается на странице просмотра (assign-manager).
                             Обращение к project.manager здесь запрещено: связь LAZY,
                             а open-in-view выключен — шаблон получил бы LazyInitializationException. -->
                        <div class="ap-field" th:if="${project.id == null}">
                            <label class="ap-label" for="managerId">Менеджер</label>
                            <select class="ap-select" id="managerId" name="managerId">
                                <option value="">Не назначен</option>
                                <option th:each="m : ${managers}"
                                        th:value="${m.id}"
                                        th:text="${m.fullName + ' (' + m.username + ')'}"></option>
                            </select>
                            <span class="ap-hint">Можно назначить позже на странице проекта</span>
                        </div>

                        <div class="ap-field" th:unless="${project.id == null}">
                            <span class="ap-label">Менеджер</span>
                            <span class="ap-hint">Назначается на странице проекта</span>
                            <a th:href="@{/admin/projects/view/{id}(id=${project.id})}"
                               class="ap-btn ap-btn-outline ap-btn-sm" style="align-self:flex-start;margin-top:2px">
                                Открыть проект
                            </a>
                        </div>

                        <div class="ap-field">
                            <span class="ap-label">Статус</span>
                            <label class="ap-switch">
                                <input type="checkbox" id="active" name="active" value="true"
                                       th:checked="${project.id == null ? true : project.active}">
                                <span class="ap-switch-track"></span>
                                <span>Активен</span>
                            </label>
                        </div>

                    </div>

                    <hr style="margin:22px 0">

                    <div class="ap-cluster">
                        <button type="submit" class="ap-btn ap-btn-dark">
                            <svg th:replace="~{fragments/icons :: i-check}"></svg>
                            <span th:text="${project.id == null ? 'Создать' : 'Сохранить'}">Сохранить</span>
                        </button>
                        <a th:href="@{/admin/projects}" class="ap-btn ap-btn-outline">
                            <svg th:replace="~{fragments/icons :: i-x}"></svg>
                            Отмена
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
