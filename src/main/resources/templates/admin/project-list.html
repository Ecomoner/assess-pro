<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Управление проектами')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'projects')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('Поиск проектов...', '/admin/projects', 'search')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Проекты</h1>
            <p th:text="${(totalItems != null ? totalItems : 0) + ' проектов'}">0 проектов</p>
        </div>

        <!-- Флеш-сообщения: createProject кладёт flash-атрибуты message/error,
             updateProject и deleteProject — successMessage/errorMessage. -->
        <div th:if="${successMessage}" class="ap-alert"
             style="background:#f0fdf4;color:#166534;border-color:#dcfce7">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>
        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;color:#b91c1c;border-color:#fecaca">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>
        <div th:if="${message}" class="ap-alert"
             style="background:#f0fdf4;color:#166534;border-color:#dcfce7">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${message}">Успех</span>
        </div>
        <div th:if="${error}" class="ap-alert"
             style="background:#fef2f2;color:#b91c1c;border-color:#fecaca">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${error}">Ошибка</span>
        </div>

        <!-- Панель действий -->
        <div class="ap-toolbar">

            <form method="get" th:action="@{/admin/projects}" class="ap-cluster">
                <input type="hidden" name="search" th:value="${search != null ? search : ''}">
                <select class="ap-select" name="size" aria-label="Размер страницы" style="width:auto;min-width:96px">
                    <option value="10" th:selected="${pageSize == 10}">10</option>
                    <option value="20" th:selected="${pageSize == 20}">20</option>
                    <option value="50" th:selected="${pageSize == 50}">50</option>
                </select>
                <button type="submit" class="ap-btn ap-btn-outline ap-btn-sm">Применить</button>
            </form>

            <a th:href="@{/admin/projects/new}" class="ap-btn ap-btn-dark ap-btn-sm">
                <svg th:replace="~{fragments/icons :: i-plus}"></svg>
                Создать проект
            </a>

        </div>

        <!-- Таблица проектов -->
        <div class="ap-table-card ap-stack-mobile">
            <table>
                <thead>
                <tr>
                    <th scope="col">Название</th>
                    <th scope="col">Менеджер</th>
                    <th scope="col">Тестировщики</th>
                    <th scope="col">Статус</th>
                    <th scope="col" class="ap-td-actions"><span class="ap-visually-hidden">Действия</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${projects}">

                    <td data-label="Название">
                        <a class="ap-cell-title" th:href="@{/admin/projects/view/{id}(id=${p.id})}"
                           th:text="${p.name}">Проект</a>
                    </td>

                    <td data-label="Менеджер" th:text="${p.manager} ?: 'Не назначен'">Менеджер</td>

                    <td data-label="Тестировщики" class="ap-td-num"
                        th:text="${p.testersCount != null ? p.testersCount : 0}">0</td>

                    <td data-label="Статус">
                        <span class="ap-tag ap-ok" th:if="${p.active}">
                            <span class="ap-dot-sm"></span>Активен
                        </span>
                        <span class="ap-tag ap-neutral" th:unless="${p.active}">
                            <span class="ap-dot-sm"></span>Неактивен
                        </span>
                    </td>

                    <td data-label="Действия" class="ap-td-actions">
                        <div class="ap-cluster" style="justify-content:flex-end">

                            <a th:href="@{/admin/projects/view/{id}(id=${p.id})}"
                               class="ap-btn ap-btn-icon ap-btn-sm" title="Просмотр" aria-label="Просмотр">
                                <svg th:replace="~{fragments/icons :: i-eye}"></svg>
                            </a>

                            <a th:href="@{/admin/projects/edit/{id}(id=${p.id})}"
                               class="ap-btn ap-btn-icon ap-btn-sm" title="Редактировать" aria-label="Редактировать">
                                <svg th:replace="~{fragments/icons :: i-edit}"></svg>
                            </a>

                            <button type="button" class="ap-btn ap-btn-icon ap-btn-sm js-delete-project"
                                    title="Удалить проект" aria-label="Удалить проект"
                                    th:if="${p.testersCount == null or p.testersCount == 0}"
                                    th:attr="data-name=${p.name},
                                             data-action=@{/admin/projects/delete/{id}(id=${p.id})}">
                                <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                            </button>

                            <button type="button" class="ap-btn ap-btn-icon ap-btn-sm" disabled
                                    th:if="${p.testersCount != null and p.testersCount > 0}"
                                    title="Нельзя удалить проект с тестировщиками"
                                    aria-label="Удаление недоступно">
                                <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                            </button>

                        </div>
                    </td>
                </tr>

                <tr th:if="${projects == null or #lists.isEmpty(projects)}">
                    <td colspan="5" class="ap-empty-row" data-label="Пусто">Проекты не найдены</td>
                </tr>
                </tbody>
            </table>

            <!-- Пагинация внутри карточки, вне таблицы -->
            <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/admin/projects', ${search}, null, ${pageSize})}"></div>
        </div>

    </main>

</div>

<!-- Подтверждение удаления: нативный <dialog>, без Bootstrap-модалок -->
<dialog class="ap-dialog" id="deleteProjectDialog">
    <div class="ap-dialog-head">Удалить проект?</div>
    <div class="ap-dialog-body">
        Проект <strong id="deleteProjectName"></strong> будет удалён безвозвратно.
    </div>
    <div class="ap-dialog-foot">
        <button type="button" class="ap-btn ap-btn-outline" id="deleteProjectCancel">Отмена</button>
        <form method="post" id="deleteProjectForm" style="display:inline">
            <button type="submit" class="ap-btn ap-btn-danger">Удалить</button>
        </form>
    </div>
</dialog>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    // Удаление проекта через нативный диалог
    (function () {
        var dialog = document.getElementById('deleteProjectDialog');
        if (!dialog) return;

        var form = document.getElementById('deleteProjectForm');
        var nameEl = document.getElementById('deleteProjectName');
        var cancel = document.getElementById('deleteProjectCancel');

        document.querySelectorAll('.js-delete-project').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (nameEl) nameEl.textContent = btn.getAttribute('data-name') || '';
                if (form) form.setAttribute('action', btn.getAttribute('data-action') || '');
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
            });
        });

        if (cancel) {
            cancel.addEventListener('click', function () { dialog.close(); });
        }
    })();
</script>
</body>
</html>
