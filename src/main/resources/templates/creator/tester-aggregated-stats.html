<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Статистика тестировщика')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'tests')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки + заголовок -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/creator/tests}">Мои тесты</a>
            <span class="sep">/</span>
            <a th:href="@{/creator/tests/{testId}/statistics/aggregated/testers(testId=${test.id})}">Агрегированная статистика</a>
            <span class="sep">/</span>
            <span class="cur">Детально</span>
        </nav>

        <div class="ap-page-head ap-between" style="flex-wrap:wrap">
            <div>
                <h1 th:text="${test.title}">Название теста</h1>
                <p>
                    Тестировщик:
                    <strong th:text="${aggregatedStats.testerUsername}">username</strong>
                </p>
            </div>
            <a th:href="@{/creator/tests/{testId}/statistics/aggregated/testers(testId=${test.id})}"
               class="ap-btn ap-btn-outline">
                <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                Назад
            </a>
        </div>

        <!-- Метрики -->
        <div class="ap-metrics" style="margin-bottom:24px">
            <div class="ap-metric">
                <div class="l">Всего попыток</div>
                <div class="v" th:text="${aggregatedStats.totalAttempts}">0</div>
            </div>
            <div class="ap-metric">
                <div class="l">Завершено</div>
                <div class="v" th:text="${aggregatedStats.completedAttempts}">0</div>
            </div>
            <div class="ap-metric">
                <div class="l">Средний балл</div>
                <div class="v">
                    <span th:text="${#numbers.formatDecimal(aggregatedStats.averagePercentage != null ? aggregatedStats.averagePercentage : 0, 1, 1)}">0,0</span><small>%</small>
                </div>
            </div>
            <div class="ap-metric">
                <div class="l">Лучший результат</div>
                <div class="v">
                    <span th:text="${#numbers.formatDecimal(aggregatedStats.bestPercentage != null ? aggregatedStats.bestPercentage : 0, 1, 1)}">0,0</span><small>%</small>
                </div>
            </div>
        </div>

        <!-- История попыток -->
        <div class="ap-table-card ap-stack-mobile">

            <div class="ap-card-head" style="border-bottom:1px solid var(--ap-line)">
                <h3>История попыток</h3>
                <span class="ap-tag ap-neutral" th:text="${aggregatedStats.totalAttempts} + ' зап.'">0 зап.</span>
            </div>

            <table>
                <thead>
                <tr>
                    <th scope="col">Дата</th>
                    <th scope="col">Результат</th>
                    <th scope="col">Длительность</th>
                    <th scope="col" class="ap-td-actions"><span class="ap-visually-hidden">Действия</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="attempt : ${aggregatedStats.recentAttempts}">
                    <td data-label="Дата" class="ap-date"
                        th:text="${#temporals.format(attempt.startTime, 'dd.MM.yy HH:mm')}">01.01.24 15:30</td>

                    <td data-label="Результат">
                        <div class="ap-score-cell">
                            <div class="ap-score-bar">
                                <i th:style="'width:' + ${attempt.percentage != null ? attempt.percentage : 0} + '%'"></i>
                            </div>
                            <span class="ap-score-num"
                                  th:text="${attempt.score} + '/' + ${attempt.maxScore}">0/0</span>
                            <span class="ap-score-pct"
                                  th:text="${#numbers.formatDecimal(attempt.percentage != null ? attempt.percentage : 0, 1, 1)} + '%'">0,0%</span>
                        </div>
                    </td>

                    <td data-label="Длительность" class="ap-date"
                        th:text="${attempt.formattedDuration}">15 мин</td>

                    <td data-label="Действия" class="ap-td-actions">
                        <a th:href="@{/creator/tests/{testId}/statistics/tester/{attemptId}(testId=${test.id}, attemptId=${attempt.attemptId})}"
                           class="ap-btn ap-btn-icon ap-btn-sm" title="Детали" aria-label="Детали">
                            <svg th:replace="~{fragments/icons :: i-eye}"></svg>
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(aggregatedStats.recentAttempts)}">
                    <td colspan="4" class="ap-empty-row" data-label="Пусто">Попыток пока нет</td>
                </tr>
                </tbody>
            </table>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
