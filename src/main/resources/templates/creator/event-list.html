<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('События')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'events')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Заголовок страницы -->
        <div class="ap-page-head ap-between" style="align-items:flex-end">
            <div>
                <h1>События</h1>
                <p th:text="${(events != null ? #lists.size(events) : 0) + ' событий'}">0 событий</p>
            </div>
            <a th:href="@{/creator/events/new}" class="ap-btn ap-btn-dark">
                <svg th:replace="~{fragments/icons :: i-plus}"></svg>
                Создать событие
            </a>
        </div>

        <!-- Сообщения -->
        <div th:if="${successMessage}" class="ap-alert"
             style="background:#f0fdf4;color:#15803d;border-color:#dcfce7">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>
        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;color:#b91c1c;border-color:#fee2e2">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <!-- Таблица событий -->
        <div class="ap-table-card ap-stack-mobile">
            <table>
                <thead>
                <tr>
                    <th scope="col">Название</th>
                    <th scope="col">Дата</th>
                    <th scope="col">Создал</th>
                    <th scope="col" class="ap-td-actions"><span class="ap-visually-hidden">Действия</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td data-label="Название">
                        <div class="ap-cell-title" th:text="${event.title}">Название события</div>
                        <div class="ap-cell-sub" th:if="${event.description}"
                             th:text="${#strings.abbreviate(event.description, 80)}">Описание</div>
                    </td>
                    <td data-label="Дата" class="ap-date"
                        th:text="${event.start != null ? #temporals.format(event.start, 'dd.MM.yyyy') : '—'}">01.01.2025</td>
                    <td data-label="Создал"
                        th:text="${event.createdByName != null ? event.createdByName : '—'}">Автор</td>
                    <td data-label="Действия" class="ap-td-actions">
                        <a th:href="@{/creator/events/edit/{id}(id=${event.id})}"
                           class="ap-btn ap-btn-icon ap-btn-sm" title="Редактировать">
                            <svg th:replace="~{fragments/icons :: i-edit}"></svg>
                        </a>
                        <button type="button" class="ap-btn ap-btn-icon ap-btn-sm delete-event-btn"
                                title="Удалить"
                                th:attr="data-id=${event.id}, data-name=${event.title}">
                            <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                        </button>
                        <!-- Скрытая форма удаления (используется JS) -->
                        <form th:id="'deleteForm' + ${event.id}"
                              th:action="@{/creator/events/delete/{id}(id=${event.id})}"
                              method="post" style="display:none"></form>
                    </td>
                </tr>

                <tr th:if="${events == null or #lists.isEmpty(events)}">
                    <td colspan="4" class="ap-empty-row" data-label="Пусто">События не найдены</td>
                </tr>
                </tbody>
            </table>

            <!-- Пагинация -->
            <div th:replace="~{fragments/pager :: pager(${pageNumber}, ${totalPages}, '/creator/events', null, null, ${pageSize})}"></div>
        </div>

        <!-- Модальное окно подтверждения удаления: нативный <dialog>.
             id deleteModal / deleteEventName / confirmDeleteBtn и класс
             .delete-event-btn с data-name обязательны — их ищет static/js/common.js. -->
        <dialog class="ap-dialog" id="deleteModal">
            <div class="ap-dialog-head">Подтверждение удаления</div>
            <div class="ap-dialog-body">
                <p>Удалить событие <strong id="deleteEventName"></strong>?</p>
            </div>
            <div class="ap-dialog-foot">
                <button type="button" class="ap-btn ap-btn-outline" data-dialog-close>Отмена</button>
                <button type="button" class="ap-btn ap-btn-danger" id="confirmDeleteBtn">Удалить</button>
            </div>
        </dialog>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    /* common.js вызывает глобальный initDeleteModal, которого в текущей
       сборке нет. Реализуем его на нативном <dialog>, сохраняя
       контракт опций, который ожидает common.js. */
    window.initDeleteModal = function (opts) {
        var dialog = document.getElementById(opts.modalId);
        var confirmBtn = document.getElementById(opts.confirmBtnId);
        var nameEl = document.getElementById(opts.nameElementId);
        if (!dialog || !confirmBtn) return;

        var pendingForm = null;

        function open() {
            if (typeof dialog.showModal === 'function') { dialog.showModal(); }
            else { dialog.setAttribute('open', ''); }
        }

        dialog.querySelectorAll('[data-dialog-close]').forEach(function (b) {
            b.addEventListener('click', function () { dialog.close(); });
        });
        dialog.addEventListener('click', function (e) {
            if (e.target === dialog) { dialog.close(); }
        });

        document.querySelectorAll(opts.buttonsSelector).forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = btn.getAttribute('data-id');
                var name = btn.dataset[opts.nameDataAttr] || btn.getAttribute('data-name') || '';
                if (nameEl) { nameEl.textContent = name; }
                pendingForm = document.getElementById(opts.formPrefix + id);
                open();
            });
        });

        confirmBtn.addEventListener('click', function () {
            if (pendingForm) { pendingForm.submit(); }
        });
    };
</script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
