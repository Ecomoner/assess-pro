<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Категории')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'categories')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Page head -->
        <div class="ap-page-head ap-between" style="flex-wrap:wrap;align-items:flex-start">

            <div>
                <h1>Категории</h1>
                <p th:text="${(totalItems != null ? totalItems : (categories != null ? categories.size() : 0)) + ' категорий'}">
                    0 категорий
                </p>
            </div>

            <a th:href="@{/creator/categories/new}" class="ap-btn ap-btn-dark">
                <svg th:replace="~{fragments/icons :: i-plus}"></svg>
                Создать категорию
            </a>

        </div>

        <!-- Сообщения -->
        <div th:if="${successMessage}" class="ap-alert"
             style="background:#f0fdf4;border-color:#dcfce7;color:#15803d">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>

        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;border-color:#fee2e2;color:#b91c1c">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <!-- Таблица категорий -->
        <div class="ap-table-card ap-stack-mobile"
             th:if="${categories != null and !categories.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th scope="col">Название</th>
                    <th scope="col">Описание</th>
                    <th scope="col">Тестов</th>
                    <th scope="col">Статус</th>
                    <th scope="col" class="ap-td-actions">Действия</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="category : ${categories}">

                    <td data-label="Название">
                        <div class="ap-cell-title" th:text="${category.name}">Математика</div>
                        <div class="ap-cell-sub ap-date"
                             th:text="${category.createdAt != null ? #temporals.format(category.createdAt, 'dd.MM.yy') : '—'}">01.01.24</div>
                    </td>

                    <td data-label="Описание" class="ap-small ap-muted"
                        th:text="${#strings.isEmpty(category.description) ? '—' : #strings.abbreviate(category.description, 80)}">
                        Описание
                    </td>

                    <td data-label="Тестов" class="ap-td-num"
                        th:text="${category.testsCount != null ? category.testsCount : 0}">0</td>

                    <td data-label="Статус">
                        <span class="ap-tag ap-ok"
                              th:if="${category.publishedTestsCount != null and category.publishedTestsCount > 0}"
                              th:text="${'опубликовано: ' + category.publishedTestsCount}">опубликовано: 1</span>
                        <span class="ap-tag ap-neutral"
                              th:if="${category.publishedTestsCount == null or category.publishedTestsCount == 0}">черновики</span>
                    </td>

                    <td data-label="Действия" class="ap-td-actions">

                        <a th:href="@{/creator/categories/edit/{id}(id=${category.id})}"
                           class="ap-btn ap-btn-icon ap-btn-sm"
                           title="Изменить" aria-label="Изменить">
                            <svg th:replace="~{fragments/icons :: i-edit}"></svg>
                        </a>

                        <button type="button"
                                class="ap-btn ap-btn-icon ap-btn-sm"
                                th:attr="data-dialog=${'categoryDelete' + category.id}"
                                title="Удалить" aria-label="Удалить">
                            <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                        </button>

                    </td>

                </tr>

                </tbody>
            </table>

            <!-- Контроллер пагинирует (PaginationUtils) -->
            <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/creator/categories', null, null, ${pageSize})}"></div>
        </div>

        <!-- Пустое состояние -->
        <div th:if="${categories == null or categories.isEmpty()}" class="ap-empty">
            <svg th:replace="~{fragments/icons :: i-categories}"></svg>
            <div>
                Категорий ещё нет.
                <a th:href="@{/creator/categories/new}">Создать первую</a>
            </div>
        </div>

        <!-- Подтверждение удаления: нативный dialog.
             POST-эндпоинт тот же, что был в старой странице. -->
        <dialog class="ap-dialog" th:each="category : ${categories}"
                th:id="${'categoryDelete' + category.id}">

            <div class="ap-dialog-head">Удалить категорию?</div>

            <div class="ap-dialog-body">
                Категория <strong th:text="${category.name}">Название</strong> будет удалена.
                Действие необратимо.
            </div>

            <div class="ap-dialog-foot">
                <button type="button" class="ap-btn ap-btn-outline" data-dialog-close>Отмена</button>
                <form th:action="@{/creator/categories/delete/{id}(id=${category.id})}" method="post">
                    <button type="submit" class="ap-btn ap-btn-danger">Удалить</button>
                </form>
            </div>

        </dialog>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    // Открытие / закрытие нативных диалогов подтверждения удаления
    (function () {
        document.querySelectorAll('[data-dialog]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var dialog = document.getElementById(btn.getAttribute('data-dialog'));
                if (!dialog) return;
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
            });
        });

        document.querySelectorAll('[data-dialog-close]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var dialog = btn.closest('dialog');
                if (dialog) dialog.close();
            });
        });
    })();
</script>
</body>
</html>
