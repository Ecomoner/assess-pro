<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Вопросы теста')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'tests')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/creator/tests}">Тесты</a>
            <span class="sep">/</span>
            <span th:text="${test.title}">Название теста</span>
            <span class="sep">/</span>
            <span class="cur">Вопросы</span>
        </nav>

        <!-- Page head -->
        <div class="ap-page-head ap-between" style="flex-wrap:wrap;align-items:flex-start">

            <div>
                <h1>Вопросы</h1>
                <p th:text="${test.title + ' · ' + (questions != null ? questions.size() : 0) + ' вопр.'}">
                    Название теста · 0 вопр.
                </p>
            </div>

            <div class="ap-cluster">

                <!-- Вопросы пересдачи -->
                <a th:if="${test.retakeTestId != null}"
                   th:href="@{/creator/tests/{retakeTestId}/questions(testId=${test.id}, retakeTestId=${test.retakeTestId})}"
                   class="ap-btn ap-btn-outline ap-btn-sm">
                    <svg th:replace="~{fragments/icons :: i-eye}"></svg>
                    Вопросы пересдачи
                </a>

                <a th:href="@{/creator/tests/{testId}/questions/new(testId=${test.id})}"
                   class="ap-btn ap-btn-dark">
                    <svg th:replace="~{fragments/icons :: i-plus}"></svg>
                    Добавить вопрос
                </a>

            </div>

        </div>

        <!-- Сообщения -->
        <div th:if="${successMessage}" class="ap-alert"
             style="background:#f0fdf4;border-color:#dcfce7;color:#15803d">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>

        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;border-color:#fee2e2;color:#b91c1c">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <!-- Список вопросов -->
        <div class="ap-card" th:if="${questionDTOs != null and !questionDTOs.isEmpty()}">

            <div class="ap-card-head">
                <h3>Все вопросы</h3>
                <span class="ap-tag ap-neutral"
                      th:text="${questionDTOs.size() + ' шт.'}">0 шт.</span>
            </div>

            <div class="ap-card-body">

                <div class="ap-row" th:each="question, stat : ${questionDTOs}">

                    <div class="ap-grow">

                        <div class="ap-title">
                            <span class="ap-tag ap-neutral ap-mono" th:text="${stat.count}">1</span>
                            <span th:text="${#strings.abbreviate(question.text, 70)}">Текст вопроса</span>
                        </div>

                        <div class="ap-meta">
                            <span th:text="${(question.totalAnswerOptions != null ? question.totalAnswerOptions : 0) + ' вариантов'}">
                                0 вариантов
                            </span>
                            <span class="ap-tag ap-ok"
                                  th:if="${question.correctAnswerOptions != null and question.correctAnswerOptions > 0}"
                                  th:text="${'верных: ' + question.correctAnswerOptions}">верных: 1</span>
                            <span class="ap-tag ap-bad"
                                  th:if="${question.correctAnswerOptions == null or question.correctAnswerOptions == 0}">нет верного</span>
                        </div>

                    </div>

                    <div class="ap-cluster">

                        <a th:href="@{/creator/tests/{testId}/questions/{questionId}/edit(testId=${test.id}, questionId=${question.id})}"
                           class="ap-btn ap-btn-outline ap-btn-sm">
                            <svg th:replace="~{fragments/icons :: i-edit}"></svg>
                            Изменить
                        </a>

                        <button type="button"
                                class="ap-btn ap-btn-icon ap-btn-sm"
                                th:attr="data-dialog=${'questionDelete' + question.id}"
                                title="Удалить вопрос" aria-label="Удалить вопрос">
                            <svg th:replace="~{fragments/icons :: i-trash}"></svg>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Пустое состояние -->
        <div class="ap-empty" th:if="${questionDTOs == null or questionDTOs.isEmpty()}">
            <svg th:replace="~{fragments/icons :: i-tests}"></svg>
            <div>
                В этом тесте пока нет вопросов.
                <a th:href="@{/creator/tests/{testId}/questions/new(testId=${test.id})}">Добавить первый</a>
            </div>
        </div>

        <!-- Подтверждение удаления: нативный dialog, форма живёт внутри него.
             POST-эндпоинт тот же, что был в старой странице. -->
        <dialog class="ap-dialog" th:each="question : ${questionDTOs}"
                th:id="${'questionDelete' + question.id}">

            <div class="ap-dialog-head">Удалить вопрос?</div>

            <div class="ap-dialog-body">
                <span th:text="${#strings.abbreviate(question.text, 120)}">Текст вопроса</span>
                <br>Действие необратимо.
            </div>

            <div class="ap-dialog-foot">
                <button type="button" class="ap-btn ap-btn-outline" data-dialog-close>Отмена</button>
                <form th:action="@{/creator/tests/{testId}/questions/{questionId}/delete(testId=${test.id}, questionId=${question.id})}"
                      method="post">
                    <button type="submit" class="ap-btn ap-btn-danger">Удалить</button>
                </form>
            </div>

        </dialog>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    // Открытие / закрытие нативных диалогов подтверждения удаления
    (function () {
        document.querySelectorAll('[data-dialog]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var dialog = document.getElementById(btn.getAttribute('data-dialog'));
                if (!dialog) return;
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
            });
        });

        document.querySelectorAll('[data-dialog-close]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var dialog = btn.closest('dialog');
                if (dialog) dialog.close();
            });
        });
    })();
</script>
</body>
</html>
