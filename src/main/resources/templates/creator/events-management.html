<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Управление событиями')}"></head>
<body>

<!-- CSS FullCalendar. head заменён фрагментом headerModern целиком,
     поэтому таблица стилей подключается здесь: link rel=stylesheet
     в body разрешён HTML5 и применяется браузером. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css">

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'events')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Заголовок страницы -->
        <div class="ap-page-head">
            <h1>Управление событиями</h1>
            <p>Нажмите на день в календаре, чтобы создать событие, или на событие — чтобы изменить его.</p>
        </div>

        <!-- Календарь -->
        <div class="ap-card">
            <div class="ap-card-head">
                <h3>Календарь событий</h3>
                <span class="ap-small ap-muted">Месяц</span>
            </div>

            <div class="ap-card-body" style="padding:16px 20px 20px">
                <div id="calendar" style="min-height:600px;max-width:900px;margin:0 auto"></div>
            </div>
        </div>

        <!-- Форма события: нативный <dialog> вместо старой модалки.
             id eventForm / eventId / title / start / description / saveBtn /
             deleteBtn / eventModalLabel сохранены — их использует скрипт ниже. -->
        <dialog class="ap-dialog" id="eventModal">
            <form id="eventForm">
                <div class="ap-dialog-head" id="eventModalLabel">Событие</div>

                <div class="ap-dialog-body">
                    <input type="hidden" id="eventId">

                    <div class="ap-stack-sm">
                        <label class="ap-label" for="title">Название<span class="req">*</span></label>
                        <input type="text" class="ap-input" id="title" required maxlength="100">

                        <label class="ap-label" for="start">Дата<span class="req">*</span></label>
                        <input type="date" class="ap-input" id="start" required>

                        <label class="ap-label" for="description">Описание</label>
                        <textarea class="ap-textarea" id="description" rows="3"></textarea>

                        <p class="ap-err" id="eventFormError" hidden></p>

                        <!-- Подтверждение удаления внутри диалога -->
                        <div id="deleteConfirm" hidden
                             style="border:1px solid #fee2e2;background:#fef2f2;border-radius:12px;padding:12px 14px">
                            <p class="ap-small" style="color:#b91c1c;margin-bottom:10px">
                                Событие будет удалено безвозвратно.
                            </p>
                            <div class="ap-cluster">
                                <button type="button" class="ap-btn ap-btn-outline ap-btn-sm"
                                        id="deleteConfirmCancel">Отмена</button>
                                <button type="button" class="ap-btn ap-btn-danger ap-btn-sm"
                                        id="deleteConfirmBtn">Удалить безвозвратно</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ap-dialog-foot">
                    <button type="button" class="ap-btn ap-btn-outline" data-dialog-close>Закрыть</button>
                    <button type="button" class="ap-btn ap-btn-danger" id="deleteBtn"
                            style="display:none">Удалить</button>
                    <button type="button" class="ap-btn ap-btn-dark" id="saveBtn">Сохранить</button>
                </div>
            </form>
        </dialog>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {

        var dialogEl = document.getElementById('eventModal');
        var errorEl = document.getElementById('eventFormError');
        var deleteConfirm = document.getElementById('deleteConfirm');
        var deleteBtn = document.getElementById('deleteBtn');

        function showDialog() {
            if (typeof dialogEl.showModal === 'function') { dialogEl.showModal(); }
            else { dialogEl.setAttribute('open', ''); }
        }

        function hideDialog() {
            if (typeof dialogEl.close === 'function') { dialogEl.close(); }
            else { dialogEl.removeAttribute('open'); }
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.hidden = false;
        }

        function clearError() {
            errorEl.textContent = '';
            errorEl.hidden = true;
        }

        function setDeleteVisible(on) {
            deleteBtn.style.display = on ? 'inline-flex' : 'none';
        }

        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ru',
            firstDay: 1,
            events: '/api/events',
            selectable: true,
            select: function(info) {
                document.getElementById('eventId').value = '';
                document.getElementById('title').value = '';
                document.getElementById('start').value = info.startStr;
                document.getElementById('description').value = '';
                setDeleteVisible(false);
                deleteConfirm.hidden = true;
                clearError();
                document.getElementById('eventModalLabel').textContent = 'Новое событие';
                showDialog();
                calendar.unselect();
            },
            eventClick: function(info) {
                var event = info.event;
                document.getElementById('eventId').value = event.id;
                document.getElementById('title').value = event.title;
                document.getElementById('start').value = event.startStr;
                document.getElementById('description').value = event.extendedProps.description || '';
                setDeleteVisible(true);
                deleteConfirm.hidden = true;
                clearError();
                document.getElementById('eventModalLabel').textContent = 'Редактировать событие';
                showDialog();
                info.jsEvent.preventDefault();
            },
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                omitZeroMinute: false,
                meridiem: false
            }
        });
        calendar.render();

        // Закрытие по кнопке и по клику на подложку
        dialogEl.querySelectorAll('[data-dialog-close]').forEach(function (b) {
            b.addEventListener('click', hideDialog);
        });
        dialogEl.addEventListener('click', function (e) {
            if (e.target === dialogEl) { hideDialog(); }
        });

        function saveEvent() {
            var id = document.getElementById('eventId').value;
            var title = document.getElementById('title').value;
            var start = document.getElementById('start').value;
            var description = document.getElementById('description').value;

            if (!title || !start) {
                showError('Название и дата обязательны');
                return;
            }
            clearError();

            var data = { title: title, start: start, description: description };
            var url = '/api/events';
            var method = 'POST';
            if (id) { url += '/' + id; method = 'PUT'; }

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(function(response) {
                if (response.ok) {
                    calendar.refetchEvents();
                    hideDialog();
                } else {
                    showError('Ошибка сохранения');
                }
            }).catch(function() {
                showError('Ошибка сохранения');
            });
        }

        document.getElementById('saveBtn').addEventListener('click', saveEvent);

        // Enter в полях формы не должен перезагружать страницу
        document.getElementById('eventForm').addEventListener('submit', function (e) {
            e.preventDefault();
            saveEvent();
        });

        // Удаление: сначала подтверждение внутри диалога, затем DELETE
        deleteBtn.addEventListener('click', function () {
            deleteConfirm.hidden = false;
        });

        document.getElementById('deleteConfirmCancel').addEventListener('click', function () {
            deleteConfirm.hidden = true;
        });

        document.getElementById('deleteConfirmBtn').addEventListener('click', function () {
            var id = document.getElementById('eventId').value;
            if (!id) return;
            fetch('/api/events/' + id, { method: 'DELETE' }).then(function(response) {
                if (response.ok) {
                    var existing = calendar.getEventById(id);
                    if (existing) { existing.remove(); }
                    hideDialog();
                }
            });
        });
    });
</script>
</body>
</html>
