<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern(${action == 'create' ? 'Создание категории' : 'Редактирование категории'})}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'categories')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/creator/categories}">Категории</a>
            <span class="sep">/</span>
            <span class="cur"
                  th:text="${action == 'create' ? 'Создание' : 'Редактирование'}">Создание</span>
        </nav>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1 th:text="${action == 'create' ? 'Создание категории' : 'Редактирование категории'}">
                Создание категории
            </h1>
            <p>Категории группируют тесты в каталоге</p>
        </div>

        <!-- Сообщение об ошибке -->
        <div th:if="${errorMessage}" class="ap-alert"
             style="background:#fef2f2;border-color:#fee2e2;color:#b91c1c">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <div class="ap-card" style="max-width:760px">

            <div class="ap-card-head">
                <h3>Данные категории</h3>
            </div>

            <div class="ap-card-body">

                <!-- formAction приходит из контроллера только для edit;
                     при создании форма уходит на текущий URL (/creator/categories/new). -->
                <form th:action="${formAction}"
                      th:object="${categoryDTO}"
                      method="post"
                      style="padding-top:14px">

                    <div class="ap-form-grid">

                        <div class="ap-field"
                             th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                            <label class="ap-label" for="name">Название<span class="req">*</span></label>
                            <input type="text"
                                   class="ap-input"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Например: Математика"
                                   required>
                            <div class="ap-err" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">Ошибка</div>
                        </div>

                        <div class="ap-field ap-span-2"
                             th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'">
                            <label class="ap-label" for="description">Описание</label>
                            <textarea class="ap-textarea"
                                      id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Коротко о том, какие тесты входят в категорию"></textarea>
                            <div class="ap-hint">Необязательно, до 500 символов</div>
                            <div class="ap-err" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">Ошибка</div>
                        </div>

                        <div class="ap-span-2" th:if="${action == 'edit'}">
                            <label class="ap-switch" for="isActive">
                                <input type="checkbox"
                                       id="isActive"
                                       name="isActive"
                                       value="true"
                                       th:checked="${categoryDTO.isActive}">
                                <span class="ap-switch-track"></span>
                                <span>Активна</span>
                            </label>
                            <div class="ap-hint" style="margin-top:6px">
                                Неактивные категории скрыты из каталога тестировщиков
                            </div>
                        </div>

                    </div>

                    <hr>

                    <!-- Кнопки -->
                    <div class="ap-cluster">

                        <button type="submit" class="ap-btn ap-btn-dark">
                            <svg th:replace="~{fragments/icons :: i-check}"></svg>
                            <span th:text="${action == 'create' ? 'Создать' : 'Сохранить'}">Сохранить</span>
                        </button>

                        <a th:href="@{/creator/categories}" class="ap-btn ap-btn-outline">
                            <svg th:replace="~{fragments/icons :: i-x}"></svg>
                            Отмена
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
