<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Предпросмотр теста')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'tests')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <div class="ap-crumbs">
            <a th:href="@{/creator/tests}">Тесты</a>
            <span class="sep">/</span>
            <span class="cur">Предпросмотр</span>
        </div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1 th:text="${testTakingDTO.testTitle}">Название теста</h1>
            <p>
                Режим предпросмотра. Верные ответы отмечены знаком ✓.
                <span th:if="${testTakingDTO.timeLimitMinutes != null and testTakingDTO.timeLimitMinutes > 0}"
                      th:text="${'Таймер: ' + testTakingDTO.timeLimitMinutes + ' мин.'}">Таймер: 0 мин.</span>
            </p>
        </div>

        <!-- Пояснение -->
        <div class="ap-alert ap-alert-warn">
            <svg th:replace="~{fragments/icons :: i-info}"></svg>
            <span>Тестировщики видят тест так же, но с учётом ограничений по времени и доступу.</span>
        </div>

        <!-- Вопросы -->
        <div th:if="${testTakingDTO.questions == null or #lists.isEmpty(testTakingDTO.questions)}"
             class="ap-empty">
            <svg th:replace="~{fragments/icons :: i-file}"></svg>
            <div>В этом тесте пока нет вопросов.</div>
        </div>

        <div class="ap-stack" th:if="${testTakingDTO.questions != null and not #lists.isEmpty(testTakingDTO.questions)}">

            <div class="ap-card" th:each="question, stat : ${testTakingDTO.questions}" style="padding:22px">

                <div class="ap-cluster" style="margin-bottom:14px;align-items:flex-start">
                    <span class="ap-tag ap-dark" th:text="${stat.count}">1</span>
                    <div class="ap-grow" style="font-weight:600;letter-spacing:-.01em"
                         th:text="${question.text}">Текст вопроса</div>
                </div>

                <div class="ap-stack-sm">
                    <!-- TestService отдаёт текст варианта уже с суффиксом " ✓" для
                         правильного ответа, отдельного флага в DTO нет. Поэтому
                         класс ставим по суффиксу, а сам суффикс с текста снимаем:
                         иначе галочка дублируется с маркером .ap-opt-mark. -->
                    <div th:each="answer : ${question.answerOptions}"
                         class="ap-opt" style="cursor:default"
                         th:with="isCorrect=${#strings.endsWith(answer.text, '✓')},
                                  cleanText=${isCorrect
                                      ? #strings.trim(#strings.replace(answer.text, '✓', ''))
                                      : answer.text}"
                         th:classappend="${isCorrect} ? ' is-correct'">
                        <span class="ap-opt-mark"></span>
                        <span class="ap-opt-text" th:text="${cleanText}">Вариант ответа</span>
                    </div>
                </div>

            </div>

        </div>

        <!-- Навигация -->
        <div class="ap-between" style="margin-top:24px;justify-content:flex-start;flex-wrap:wrap;gap:12px">
            <a th:href="@{/creator/tests}" class="ap-btn ap-btn-outline">
                <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                К списку тестов
            </a>
            <a th:href="@{/creator/tests/{id}/questions(id=${testTakingDTO.testId})}"
               class="ap-btn ap-btn-dark">
                Управление вопросами
                <svg th:replace="~{fragments/icons :: i-arrow-right}"></svg>
            </a>
        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
