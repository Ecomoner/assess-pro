<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Экспорт статистики')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'tests')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки + заголовок -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/creator/tests}">Мои тесты</a>
            <span class="sep">/</span>
            <a th:href="@{/creator/tests/{testId}/statistics/testers(testId=${test.id})}">Статистика</a>
            <span class="sep">/</span>
            <span class="cur">Экспорт</span>
        </nav>

        <div class="ap-page-head">
            <h1 th:text="'Экспорт статистики: ' + ${test.title}">Экспорт статистики</h1>
            <p>Выберите параметры отчёта и сформируйте PDF</p>
        </div>

        <!-- Параметры отчёта -->
        <div class="ap-card">

            <div class="ap-card-head">
                <h3>Параметры отчёта</h3>
            </div>

            <div class="ap-card-body" style="padding:18px 22px">

                <form id="exportForm" th:action="@{/creator/tests/{testId}/export(testId=${test.id})}" method="get">

                    <div class="ap-form-grid">

                        <div class="ap-field">
                            <label class="ap-label" for="exportTester">Тестировщик</label>
                            <select id="exportTester" class="ap-select" name="testerUsername">
                                <option value="">Все тестировщики</option>
                                <option th:each="tester : ${testers}"
                                        th:value="${tester.username}"
                                        th:text="${tester.fullName != null ? tester.fullName + ' (' + tester.username + ')' : tester.username}">
                                </option>
                            </select>
                        </div>

                        <div class="ap-field">
                            <label class="ap-label" for="exportCategory">Категория</label>
                            <select id="exportCategory" class="ap-select" name="categoryId">
                                <option value="">Все категории</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">
                                </option>
                            </select>
                        </div>

                        <div class="ap-field">
                            <label class="ap-label" for="exportDateFrom">Дата с</label>
                            <input id="exportDateFrom" class="ap-input" type="date" name="dateFrom">
                        </div>

                        <div class="ap-field">
                            <label class="ap-label" for="exportDateTo">Дата по</label>
                            <input id="exportDateTo" class="ap-input" type="date" name="dateTo">
                        </div>

                        <div class="ap-field ap-span-2">
                            <span class="ap-label">Включить в отчёт</span>
                            <div class="ap-cluster" style="gap:20px">
                                <label class="ap-check">
                                    <input type="checkbox" id="includeCorrect" name="includeCorrect"
                                           value="true" checked>
                                    <span>Правильные ответы</span>
                                </label>
                                <label class="ap-check">
                                    <input type="checkbox" id="includeIncorrect" name="includeIncorrect"
                                           value="true" checked>
                                    <span>Неправильные ответы</span>
                                </label>
                            </div>
                        </div>

                        <!-- Статусное сообщение -->
                        <div class="ap-span-2">
                            <div id="statusMessage" class="ap-alert ap-alert-warn" role="status"
                                 style="display:none;margin-bottom:0">
                                <svg th:replace="~{fragments/icons :: i-clock}"></svg>
                                <span id="statusText"></span>
                            </div>
                        </div>

                        <div class="ap-span-2">
                            <div class="ap-cluster">
                                <button type="button" id="exportButton" class="ap-btn ap-btn-dark">
                                    <svg th:replace="~{fragments/icons :: i-download}"></svg>
                                    Сгенерировать PDF
                                </button>
                                <a th:href="@{/creator/tests/{testId}/statistics/testers(testId=${test.id})}"
                                   class="ap-btn ap-btn-outline">
                                    <svg th:replace="~{fragments/icons :: i-x}"></svg>
                                    Отмена
                                </a>
                            </div>
                        </div>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>

<!-- Формирование отчёта и скачивание -->
<script>
    document.getElementById('exportButton').addEventListener('click', async function () {
        var form = document.getElementById('exportForm');
        var button = this;
        var statusDiv = document.getElementById('statusMessage');
        var statusText = document.getElementById('statusText');

        // Собираем параметры формы
        var formData = new URLSearchParams(new FormData(form));
        var url = form.action + '?' + formData.toString();

        // Блокируем кнопку и показываем сообщение
        button.disabled = true;
        statusDiv.style.display = 'flex';
        statusText.textContent = 'Запрос отправлен, ожидайте...';

        try {
            var response = await fetch(url);
            if (!response.ok) {
                throw new Error('Ошибка сервера: ' + response.status);
            }
            var data = await response.json();
            var requestId = data.requestId;
            statusText.textContent = data.message || 'Отчёт готовится...';

            // Начинаем опрос
            var checkInterval = setInterval(async function () {
                try {
                    var res = await fetch('/export/download/' + requestId);
                    if (res.ok) {
                        clearInterval(checkInterval);
                        // Скачиваем файл
                        var blob = await res.blob();
                        var downloadUrl = window.URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'report.pdf';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(downloadUrl);
                        statusText.textContent = 'Отчёт готов, скачивание началось.';
                        button.disabled = false;
                    } else if (res.status === 404) {
                        // Ещё не готов — ждём
                        statusText.textContent = 'Генерация PDF... Пожалуйста, подождите.';
                    } else {
                        clearInterval(checkInterval);
                        statusText.textContent = 'Ошибка при получении отчёта.';
                        button.disabled = false;
                    }
                } catch (e) {
                    clearInterval(checkInterval);
                    statusText.textContent = 'Ошибка соединения. Попробуйте позже.';
                    button.disabled = false;
                }
            }, 2000);

        } catch (error) {
            statusText.textContent = 'Ошибка: ' + error.message;
            button.disabled = false;
        }
    });
</script>
</body>
</html>
