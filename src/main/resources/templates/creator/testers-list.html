<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Список тестировщиков')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('CREATOR', 'testers')}"></aside>

    <main class="ap-main">

        <!-- Action bar: поиск уходит GET-ом в /creator/testers (параметр search) -->
        <div th:replace="~{fragments/appbar :: appbar('Поиск по имени или логину...', '/creator/testers', 'search')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Тестировщики</h1>
            <p>
                Всего: <span class="ap-mono" th:text="${totalItems} ?: 0">0</span>
            </p>
        </div>

        <!-- Тулбар: размер страницы и сортировка.
             search сохраняется скрытым полем, чтобы не сбросить фильтр из appbar. -->
        <div class="ap-toolbar">

            <form th:action="@{/creator/testers}" method="get" class="ap-cluster">
                <input type="hidden" name="search" th:value="${search} ?: ''">

                <label class="ap-xs ap-muted" for="testerPageSize">На странице</label>
                <select class="ap-select" id="testerPageSize" name="size" style="width:auto">
                    <option value="10" th:selected="${pageSize == 10}">10</option>
                    <option value="20" th:selected="${pageSize == 20}">20</option>
                    <option value="50" th:selected="${pageSize == 50}">50</option>
                </select>

                <label class="ap-xs ap-muted" for="testerSort">Сортировка</label>
                <select class="ap-select" id="testerSort" name="sort" style="width:auto">
                    <option value="createdAt" th:selected="${sort == 'createdAt'}">По дате регистрации</option>
                    <option value="username" th:selected="${sort == 'username'}">По логину</option>
                    <option value="lastName" th:selected="${sort == 'lastName'}">По фамилии</option>
                </select>

                <button type="submit" class="ap-btn ap-btn-outline ap-btn-sm">
                    <svg th:replace="~{fragments/icons :: i-filter}"></svg>
                    Применить
                </button>
            </form>

            <a th:if="${search != null and !#strings.isEmpty(search)}"
               th:href="@{/creator/testers}" class="ap-btn ap-btn-ghost ap-btn-sm">
                <svg th:replace="~{fragments/icons :: i-refresh}"></svg>
                Сбросить поиск
            </a>

        </div>

        <!-- Таблица -->
        <div class="ap-table-card ap-stack-mobile">

            <table>
                <thead>
                <tr>
                    <th scope="col">ФИО</th>
                    <th scope="col">Логин</th>
                    <th scope="col">Профиль</th>
                    <th scope="col">Дата рег.</th>
                    <th scope="col">Статус</th>
                    <th scope="col" class="ap-td-actions">Действия</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="tester : ${testers}">

                    <td data-label="ФИО">
                        <span class="ap-cell-title" th:text="${tester.fullName} ?: '—'">Иванов И.И.</span>
                    </td>

                    <td data-label="Логин">
                        <span class="ap-cell-sub ap-mono" th:text="${tester.username}">ivanov</span>
                    </td>

                    <td data-label="Профиль">
                        <span class="ap-tag"
                              th:classappend="${tester.profileComplete} ? ' ap-ok' : ' ap-warn'"
                              th:text="${tester.profileComplete} ? 'Заполнен' : 'Не заполнен'">Заполнен</span>
                    </td>

                    <td data-label="Дата рег." class="ap-date"
                        th:text="${tester.createdAt != null ? #temporals.format(tester.createdAt, 'dd.MM.yy') : '—'}">01.01.24</td>

                    <td data-label="Статус">
                        <span class="ap-tag"
                              th:classappend="${tester.isActive} ? ' ap-ok' : ' ap-neutral'"
                              th:text="${tester.isActive} ? 'Активен' : 'Отключён'">Активен</span>
                    </td>

                    <td data-label="Действия" class="ap-td-actions">
                        <a th:href="@{/creator/testers/{id}/statistics(id=${tester.id})}"
                           class="ap-row-link" title="Статистика тестировщика">
                            Статистика →
                        </a>
                    </td>

                </tr>

                <tr th:if="${testers == null or testers.isEmpty()}">
                    <td colspan="6" class="ap-empty-row">
                        Тестировщики не найдены
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/creator/testers', ${search}, null, ${pageSize})}"></div>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
