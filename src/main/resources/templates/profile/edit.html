<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Редактирование профиля')}"></head>
<body>

<div class="ap-page ap-shell"
     th:with="role=${#strings.replace(#authentication.authorities.iterator().next().authority,'ROLE_','')}">

    <div class="ap-overlay" id="apOverlay"></div>

    <aside th:replace="~{fragments/sidebar :: sidebar(${role}, 'profile')}"></aside>

    <main class="ap-main">

        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <nav class="ap-crumbs" aria-label="Навигационная цепочка">
            <a th:href="@{/home}">Главная</a>
            <span class="sep">/</span>
            <span class="cur">Профиль</span>
        </nav>

        <div class="ap-page-head">
            <h1>Редактирование профиля</h1>
            <p>Измените личные данные и сохраните изменения</p>
        </div>

        <div th:if="${successMessage}" class="ap-alert" role="status"
             style="background:#f0fdf4;color:#15803d;border-color:#dcfce7">
            <svg th:replace="~{fragments/icons :: i-check}"></svg>
            <span th:text="${successMessage}">Успех</span>
        </div>

        <div th:if="${errorMessage}" class="ap-alert ap-alert-warn" role="alert">
            <svg th:replace="~{fragments/icons :: i-alert}"></svg>
            <span th:text="${errorMessage}">Ошибка</span>
        </div>

        <div class="ap-card">
            <div class="ap-card-head">
                <h3>Личные данные</h3>
            </div>
            <div class="ap-card-body" style="padding-top:18px">

                <form th:action="@{/profile/edit}" th:object="${profileDTO}" method="post">

                    <div class="ap-form-grid">

                        <div class="ap-field"
                             th:classappend="${#fields.hasErrors('lastName')} ? ' is-invalid'">
                            <label class="ap-label" for="lastName">Фамилия<span class="req">*</span></label>
                            <input type="text" class="ap-input"
                                   id="lastName"
                                   name="lastName"
                                   th:value="*{lastName}"
                                   required>
                            <div class="ap-err" th:if="${#fields.hasErrors('lastName')}"
                                 th:errors="*{lastName}">Ошибка</div>
                        </div>

                        <div class="ap-field"
                             th:classappend="${#fields.hasErrors('firstName')} ? ' is-invalid'">
                            <label class="ap-label" for="firstName">Имя<span class="req">*</span></label>
                            <input type="text" class="ap-input"
                                   id="firstName"
                                   name="firstName"
                                   th:value="*{firstName}"
                                   required>
                            <div class="ap-err" th:if="${#fields.hasErrors('firstName')}"
                                 th:errors="*{firstName}">Ошибка</div>
                        </div>

                        <div class="ap-field ap-span-2">
                            <label class="ap-label" for="middleName">Отчество</label>
                            <input type="text" class="ap-input"
                                   id="middleName"
                                   name="middleName"
                                   th:value="*{middleName}">
                            <div class="ap-hint">Необязательное поле</div>
                        </div>

                        <div class="ap-field ap-span-2"
                             th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                            <label class="ap-label" for="email">Email<span class="req">*</span></label>
                            <input type="text" class="ap-input"
                                   id="email"
                                   name="email"
                                   th:value="*{email}"
                                   required>
                            <div class="ap-err" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">Ошибка</div>
                        </div>

                        <div class="ap-span-2 ap-cluster" style="margin-top:4px">
                            <button type="submit" class="ap-btn ap-btn-dark">
                                <svg th:replace="~{fragments/icons :: i-check}"></svg>
                                Сохранить
                            </button>
                            <a th:href="@{/dashboard}" class="ap-btn ap-btn-outline">
                                <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                                Отмена
                            </a>
                        </div>

                    </div>

                </form>

            </div>
        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
</body>
</html>
