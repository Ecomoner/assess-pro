<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Все доступные тесты')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('TESTER', 'catalog')}"></aside>

    <main class="ap-main"
          th:with="totalCount=${totalItems != null ? totalItems : 0}">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('Поиск тестов...', '/tester/tests', 'search')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/tester/catalog}">Каталог</a>
            <span class="sep">/</span>
            <span class="cur">Все доступные тесты</span>
        </nav>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Все доступные тесты</h1>
            <p th:text="${totalCount + ' тестов'}">0 тестов</p>
        </div>

        <!-- Тесты -->
        <div th:if="${tests != null and !tests.isEmpty()}" class="ap-active-list">

            <div th:each="test : ${tests}" class="ap-active-card">

                <div class="ap-active-top">
                    <div class="ap-active-title" th:text="${test.title}">Название теста</div>
                </div>

                <div class="ap-active-meta">
                    <span th:text="${(test.questionCount != null ? test.questionCount : 0) + ' вопросов'}">0 вопросов</span>
                    <span th:if="${test.timeLimitMinutes != null and test.timeLimitMinutes > 0}"
                          th:text="${'· ' + test.timeLimitMinutes + ' мин'}">· 30 мин</span>
                </div>

                <div class="ap-cluster">
                    <span class="ap-tag ap-neutral" th:text="${test.getSafeCategoryName()}">Без категории</span>
                </div>

                <p class="ap-small ap-muted"
                   th:text="${#strings.isEmpty(test.description) ? 'Нет описания' : #strings.abbreviate(test.description, 90)}">
                    Описание теста
                </p>

                <a th:href="@{/tester/test/{testId}/start(testId=${test.id})}"
                   class="ap-btn ap-btn-dark ap-btn-full" style="margin-top:auto">
                    <svg th:replace="~{fragments/icons :: i-play}"></svg>
                    Начать
                </a>

            </div>

        </div>

        <!-- Пустое состояние -->
        <div th:if="${tests == null or tests.isEmpty()}" class="ap-empty">
            <svg th:replace="~{fragments/icons :: i-tests}"></svg>
            <div>
                Пока нет доступных тестов.
                <a th:href="@{/tester/dashboard}">В дашборд</a>
            </div>
        </div>

        <!-- Пагинация -->
        <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/tester/catalog/all-tests', null, null, ${pageSize})}"></div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
