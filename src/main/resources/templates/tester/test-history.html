<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('История прохождений')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('TESTER', 'history')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>История прохождений</h1>
            <p th:text="${(totalItems != null ? totalItems : 0) + ' попыток'}">0 попыток</p>
        </div>

        <!-- Метрики -->
        <div class="ap-metrics" style="margin-bottom:24px">
            <div class="ap-metric">
                <div class="l">Всего</div>
                <div class="v" th:text="${totalItems != null ? totalItems : 0}">0</div>
            </div>
            <div class="ap-metric">
                <div class="l">Завершено</div>
                <div class="v" th:text="${completedCount != null ? completedCount : 0}">0</div>
            </div>
            <div class="ap-metric">
                <div class="l">В процессе</div>
                <div class="v" th:text="${inProgressCount != null ? inProgressCount : 0}">0</div>
            </div>
            <div class="ap-metric">
                <div class="l">Средний балл</div>
                <div class="v">
                    <span th:text="${#numbers.formatDecimal(averageScore != null ? averageScore : 0, 1, 1)}">0,0</span><small>%</small>
                </div>
            </div>
        </div>

        <!-- Фильтр по статусу + размер страницы -->
        <div class="ap-toolbar">

            <div class="ap-seg" role="group" aria-label="Фильтр по статусу">
                <a th:href="@{/tester/history(status='', size=${pageSize})}"
                   th:classappend="${selectedStatus == null or #strings.isEmpty(selectedStatus)} ? ' is-active'">Все</a>
                <a th:href="@{/tester/history(status='COMPLETED', size=${pageSize})}"
                   th:classappend="${selectedStatus == 'COMPLETED'} ? ' is-active'">Завершенные</a>
                <a th:href="@{/tester/history(status='IN_PROGRESS', size=${pageSize})}"
                   th:classappend="${selectedStatus == 'IN_PROGRESS'} ? ' is-active'">В процессе</a>
            </div>

            <form method="get" th:action="@{/tester/history}" class="ap-cluster">
                <input type="hidden" name="status" th:value="${selectedStatus}">
                <select class="ap-select" name="size" aria-label="Размер страницы"
                        style="width:auto;min-width:104px">
                    <option value="10" th:selected="${pageSize == 10}">10</option>
                    <option value="20" th:selected="${pageSize == 20}">20</option>
                </select>
                <button type="submit" class="ap-btn ap-btn-outline ap-btn-sm">Применить</button>
            </form>

        </div>

        <!-- Таблица истории -->
        <div class="ap-table-card ap-stack-mobile">
            <table>
                <thead>
                <tr>
                    <th scope="col">Дата</th>
                    <th scope="col">Тест</th>
                    <th scope="col">Результат</th>
                    <th scope="col">Длительность</th>
                    <th scope="col">Статус</th>
                    <th scope="col" class="ap-td-actions"><span class="ap-visually-hidden">Действия</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="attempt : ${history}">
                    <td data-label="Дата" class="ap-date"
                        th:text="${#temporals.format(attempt.startTime, 'dd.MM.yy HH:mm')}">01.01.24 15:30</td>

                    <td data-label="Тест" class="ap-test-name" th:text="${attempt.testTitle}">Название теста</td>

                    <td data-label="Результат">
                        <div class="ap-score-cell" th:if="${attempt.statusString == 'COMPLETED'}">
                            <div class="ap-score-bar">
                                <i th:style="'width:' + ${attempt.percentage} + '%'"></i>
                            </div>
                            <span class="ap-score-num"
                                  th:text="${attempt.totalScore} + '/' + ${attempt.maxPossibleScore}">0/0</span>
                            <span class="ap-score-pct"
                                  th:text="${#numbers.formatDecimal(attempt.percentage, 1, 1)} + '%'">0,0%</span>
                        </div>
                        <span th:unless="${attempt.statusString == 'COMPLETED'}" class="ap-muted ap-small">—</span>
                    </td>

                    <td data-label="Длительность" class="ap-date"
                        th:text="${attempt.durationMinutes != null ? attempt.durationMinutes + ' мин' : '—'}">0 мин</td>

                    <td data-label="Статус">
                        <span class="ap-tag ap-ok" th:if="${attempt.statusString == 'COMPLETED'}">Завершён</span>
                        <span class="ap-tag ap-warn" th:if="${attempt.statusString == 'IN_PROGRESS'}">В процессе</span>
                        <span class="ap-tag ap-neutral"
                              th:if="${attempt.statusString != 'COMPLETED' and attempt.statusString != 'IN_PROGRESS'}">Неизвестно</span>
                    </td>

                    <td data-label="Действия" class="ap-td-actions">
                        <a th:if="${attempt.statusString == 'COMPLETED'}"
                           th:href="@{/tester/attempt/{id}/results(id=${attempt.attemptId})}"
                           class="ap-row-link">Детали →</a>
                        <a th:if="${attempt.statusString != 'COMPLETED'}"
                           th:href="@{/tester/attempt/{id}(id=${attempt.attemptId})}"
                           class="ap-row-link">Продолжить →</a>
                    </td>
                </tr>

                <tr th:if="${history == null or #lists.isEmpty(history)}">
                    <td colspan="6" class="ap-empty-row" data-label="Пусто">История пуста</td>
                </tr>
                </tbody>
            </table>

            <!-- Пагинация внутри карточки, вне таблицы -->
            <div th:replace="~{fragments/pager :: pager(${currentPage}, ${totalPages}, '/tester/history', null, ${selectedStatus}, ${pageSize})}"></div>
        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
