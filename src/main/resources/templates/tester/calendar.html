<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Календарь событий')}"></head>
<body>

<!-- CSS FullCalendar. head целиком заменён фрагментом headerModern,
     поэтому таблица стилей подключается здесь: <link> в body
     разрешён HTML5 и применяется браузером. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css">

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('TESTER', 'calendar')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Календарь событий</h1>
            <p>Тесты и события, назначенные на даты</p>
        </div>

        <!-- Календарь -->
        <div class="ap-card">

            <div class="ap-card-head">
                <h3>События</h3>

                <!-- Легенда: объясняет единственный тип отметки, чтобы
                     цветной блок в сетке не выглядел загадочно -->
                <div class="ap-cluster ap-xs ap-muted" style="gap:6px">
                    <span style="width:9px;height:9px;border-radius:3px;background:var(--ap-fg);display:inline-block"></span>
                    Событие
                </div>
            </div>

            <div class="ap-card-body" style="padding:20px">
                <!-- класс .ap-calendar включает темизацию FullCalendar
                     из assesspro-ui.css -->
                <div id="calendar" class="ap-calendar"></div>
            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        if (!calendarEl) return;

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ru',
            firstDay: 1,
            height: 'auto',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth'
            },
            buttonText: {
                today: 'Сегодня',
                month: 'Месяц',
                list: 'Список'
            },
            events: '/api/events',
            eventClick: function (info) {
                if (info.event.url) {
                    window.location.href = info.event.url;
                }
                info.jsEvent.preventDefault();
            },
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                omitZeroMinute: false,
                meridiem: false
            }
        });

        calendar.render();
    });
</script>
<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
