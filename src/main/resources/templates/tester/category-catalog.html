<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Категории тестов')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('TESTER', 'catalog')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('Поиск тестов...', '/tester/tests', 'search')}"></div>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1>Категории тестов</h1>
            <p>Выберите категорию для прохождения тестов</p>
        </div>

        <!-- Категории -->
        <div th:if="${categories != null and !categories.isEmpty()}" class="ap-active-list">

            <div th:each="category : ${categories}" class="ap-active-card">

                <div class="ap-active-top">
                    <div class="ap-active-title" th:text="${category.name}">Категория</div>
                    <div class="ap-act-ico ap-dark">
                        <svg th:replace="~{fragments/icons :: i-categories}"></svg>
                    </div>
                </div>

                <div class="ap-cluster">
                    <span class="ap-tag ap-neutral"
                          th:text="${(category.testsCount != null ? category.testsCount : 0) + ' тестов'}">0 тестов</span>
                </div>

                <p class="ap-small ap-muted"
                   th:text="${#strings.isEmpty(category.description) ? 'Нет описания' : #strings.abbreviate(category.description, 90)}">
                    Описание категории
                </p>

                <a th:href="@{/tester/catalog/category/{categoryId}(categoryId=${category.id})}"
                   class="ap-btn ap-btn-dark ap-btn-full" style="margin-top:auto">
                    Перейти
                    <svg th:replace="~{fragments/icons :: i-arrow-right}"></svg>
                </a>

            </div>

        </div>

        <!-- Пустое состояние -->
        <div th:if="${categories == null or categories.isEmpty()}" class="ap-empty">
            <svg th:replace="~{fragments/icons :: i-categories}"></svg>
            <div>Пока нет доступных категорий</div>
        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
