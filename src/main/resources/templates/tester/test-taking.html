<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Прохождение теста')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('TESTER', 'catalog')}"></aside>

    <main class="ap-main"
          th:with="current=${testTakingDTO.questions[testTakingDTO.currentQuestionIndex]},
                   total=${testTakingDTO.totalQuestions},
                   step=${testTakingDTO.currentQuestionIndex + 1}">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Шапка: название теста, прогресс, таймер -->
        <div class="ap-between" style="align-items:flex-start;flex-wrap:wrap;margin-bottom:18px">

            <div class="ap-page-head" style="margin-bottom:0">
                <h1 th:text="${testTakingDTO.testTitle}" style="font-size:22px">Название теста</h1>
                <p>
                    Вопрос <span class="ap-mono" th:text="${step}">1</span>
                    из <span class="ap-mono" th:text="${total}">10</span>
                </p>
            </div>

            <div class="ap-cluster">

                <!-- id="timer" + data-minutes читает test-taking.js -->
                <div th:if="${testTakingDTO.timeLimitMinutes > 0}"
                     id="timer"
                     class="ap-tag ap-neutral ap-mono"
                     th:attr="data-minutes=${testTakingDTO.timeLimitMinutes}"
                     style="padding:9px 13px;font-size:13px;gap:7px">
                    <span style="display:inline-flex;width:13px;height:13px;flex-shrink:0;overflow:hidden">
                        <svg th:replace="~{fragments/icons :: i-clock}"></svg>
                    </span>
                    <span id="timerDisplay">--:--</span>
                </div>

                <!-- Видимый способ завершить тест, не дожидаясь таймера -->
                <button type="button" class="ap-btn ap-btn-outline ap-btn-sm" id="finishOpen">
                    <svg th:replace="~{fragments/icons :: i-check}"></svg>
                    Завершить тест
                </button>

            </div>

        </div>

        <!-- Прогресс -->
        <div class="ap-meter"
             style="margin-bottom:20px"
             role="progressbar"
             th:attr="aria-valuenow=${step * 100 / total}"
             aria-valuemin="0"
             aria-valuemax="100">
            <i th:style="'width: ' + ${step * 100 / total} + '%'"></i>
        </div>

        <!-- Вопрос -->
        <div class="ap-card" style="padding:24px">

            <div class="ap-xs ap-muted"
                 style="text-transform:uppercase;letter-spacing:.1em;font-weight:600">
                Выберите один вариант
            </div>

            <h3 th:text="${current.text}"
                style="font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.35;margin:10px 0 18px">
                Текст вопроса
            </h3>

            <!-- Форма ответов: id="answerForm" + data-attempt-id читает test-taking.js -->
            <form id="answerForm"
                  th:data-attempt-id="${testTakingDTO.attemptId}"
                  style="display:flex;flex-direction:column;gap:10px">

                <label class="ap-opt"
                       th:each="answer : ${current.answerOptions}"
                       th:for="'answer_' + ${answer.id}">
                    <input type="radio"
                           th:name="'question_' + ${current.id}"
                           th:id="'answer_' + ${answer.id}"
                           th:value="${answer.id}">
                    <span class="ap-opt-mark"></span>
                    <span class="ap-opt-text" th:text="${answer.text}">Вариант ответа</span>
                </label>

            </form>

        </div>

        <!-- Нижняя панель -->
        <div class="ap-between" style="margin-top:20px">

            <div style="flex:0 0 auto;min-width:112px">
                <button type="button"
                        class="ap-btn ap-btn-outline"
                        th:if="${testTakingDTO.currentQuestionIndex > 0}"
                        th:onclick="|goToQuestion(${testTakingDTO.currentQuestionIndex - 1})|">
                    <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                    Назад
                </button>
            </div>

            <!-- id="saveStatus" читает test-taking.js и inline-скрипт -->
            <div class="ap-xs ap-muted ap-mono" style="flex:1 1 auto;text-align:center">
                <span id="saveStatus">Автосохранение...</span>
            </div>

            <div style="flex:0 0 auto;min-width:112px;display:flex;justify-content:flex-end">
                <button type="button"
                        class="ap-btn ap-btn-dark"
                        th:if="${testTakingDTO.currentQuestionIndex < total - 1}"
                        th:onclick="|goToQuestion(${testTakingDTO.currentQuestionIndex + 1})|">
                    Далее
                    <svg th:replace="~{fragments/icons :: i-chevron-right}"></svg>
                </button>
            </div>

        </div>

        <!-- Подтверждение завершения: нативный <dialog>.
             Форма завершения живёт внутри диалога — она остаётся в DOM,
             поэтому таймер находит её через
             querySelector('form[action="/tester/attempt/N/finish"]'). -->
        <dialog class="ap-dialog" id="finishDialog">
            <div class="ap-dialog-head">Завершить тест?</div>
            <div class="ap-dialog-body">
                Неотвеченные вопросы будут засчитаны как неправильные.
                Вы уверены, что хотите завершить попытку сейчас?
            </div>
            <div class="ap-dialog-foot">
                <button type="button" class="ap-btn ap-btn-outline" id="finishCancel">Продолжить</button>
                <form th:action="@{/tester/attempt/{attemptId}/finish(attemptId=${testTakingDTO.attemptId})}"
                      method="post">
                    <button type="submit" class="ap-btn ap-btn-dark">Завершить</button>
                </form>
            </div>
        </dialog>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<!-- static/js/test-taking.js НЕ подключаем намеренно:
     он дублирует обработчик change (двойной POST ответа), рисует
     Bootstrap-иконки bi-* и его TestTimer читает timerElement.dataset.attemptId,
     которого в разметке нет — авто-завершение уходило на .../undefined/finish.
     Вся логика страницы самодостаточна в скрипте ниже. -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const attemptId = /*[[${testTakingDTO.attemptId}]]*/ null;
    const totalQuestions = /*[[${testTakingDTO.totalQuestions}]]*/ 0;
    const currentQuestionId = /*[[${testTakingDTO.questions[testTakingDTO.currentQuestionIndex].id}]]*/ null;
    const timeLimit = /*[[${testTakingDTO.timeLimitMinutes}]]*/ 0;

    if (timeLimit > 0) {
        const timerElement = document.getElementById('timer');
        if (timerElement) {
            const minutes = timeLimit;
            startTimer(minutes, 0, attemptId);
        }
    }
    /*]]>*/

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            saveAnswer(attemptId, currentQuestionId, this.value);
        });
    });

    function saveAnswer(attemptId, questionId, answerId) {
        const saveStatus = document.getElementById('saveStatus');
        saveStatus.textContent = 'Сохранение...';

        fetch(`/tester/attempt/${attemptId}/answer`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                attemptId: attemptId,
                questionId: questionId,
                answerOptionId: answerId
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    saveStatus.innerHTML = '<span style="color:#16a34a">Сохранено</span>';

                    // Если тест завершён, перенаправляем на страницу результатов
                    if (data.completed) {
                        window.location.href = `/tester/attempt/${attemptId}/results`;
                    } else {
                        setTimeout(() => {
                            saveStatus.textContent = 'Автосохранение...';
                        }, 2000);
                    }
                } else {
                    saveStatus.innerHTML = '<span style="color:#dc2626">Ошибка</span>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                saveStatus.innerHTML = '<span style="color:#dc2626">Ошибка</span>';
            });
    }


    function goToQuestion(index) {
        window.location.href = `/tester/attempt/${attemptId}/question/${index}`;
    }

    function warn(message) {
        // Неблокирующее предупреждение вместо alert(): тост в тот же стек,
        // что использует notifications.js. Если стека нет — тихо пропускаем.
        var stack = document.getElementById('apToastStack');
        if (!stack) return;
        var box = document.createElement('div');
        box.className = 'ap-toast';
        box.innerHTML = '<span>' + message + '</span>';
        stack.appendChild(box);
        setTimeout(function () { box.remove(); }, 6000);
    }

    function startTimer(minutes, seconds, attemptId) {
        let totalSeconds = minutes * 60 + seconds;
        const timerDisplay = document.getElementById('timerDisplay');

        const timer = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(timer);
                const finishForm = document.querySelector(`form[action="/tester/attempt/${attemptId}/finish"]`);
                if (finishForm) finishForm.submit();
                return;
            }

            totalSeconds--;

            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            if (timerDisplay) {
                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            if (totalSeconds === 300) {
                warn('Осталось 5 минут');
            } else if (totalSeconds === 60) {
                warn('Осталась 1 минута');
            }
        }, 1000);
    }
</script>
<script>
    // Открытие / закрытие нативного диалога завершения теста
    (function () {
        var dialog = document.getElementById('finishDialog');
        var openBtn = document.getElementById('finishOpen');
        var cancelBtn = document.getElementById('finishCancel');

        if (!dialog) return;

        if (openBtn) {
            openBtn.addEventListener('click', function () {
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
            });
        }

        if (cancelBtn) {
            cancelBtn.addEventListener('click', function () {
                dialog.close();
            });
        }
    })();
</script>
</body>
</html>
