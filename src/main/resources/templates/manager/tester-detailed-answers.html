<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Детальные ответы')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('MANAGER', 'statistics')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/manager/dashboard}">Обзор</a>
            <span class="sep">/</span>
            <span class="cur">Детальные ответы</span>
        </nav>

        <!-- Page head -->
        <div class="ap-between" style="align-items:flex-start;flex-wrap:wrap;margin-bottom:24px">

            <div class="ap-page-head" style="margin-bottom:0">
                <h1 th:text="${test.title}">Название теста</h1>
                <p>
                    Тестировщик:
                    <span th:text="${detailedAnswers.testerUsername != null ? detailedAnswers.testerUsername : '—'}">tester</span>
                </p>
            </div>

            <div class="ap-cluster">
                <button type="button" id="exportPdfButton" class="ap-btn ap-btn-dark">
                    <svg th:replace="~{fragments/icons :: i-download}"></svg>
                    Экспорт PDF
                </button>
                <a th:href="@{/manager/dashboard}" class="ap-btn ap-btn-outline">
                    <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                    Назад
                </a>
            </div>

        </div>

        <!-- Статус экспорта -->
        <div id="statusMessage" class="ap-alert" role="status"
             style="background:#f4f4f5;border-color:#ececec;color:#0f0f0f;display:none">
            <svg th:replace="~{fragments/icons :: i-info}"></svg>
            <span id="statusText"></span>
        </div>

        <!-- Метрики попытки -->
        <div class="ap-metrics" style="margin-bottom:24px">

            <div class="ap-metric">
                <div class="l">Дата</div>
                <div class="v" style="font-size:18px"
                     th:text="${detailedAnswers.startTime != null
                               ? #temporals.format(detailedAnswers.startTime, 'dd.MM.yy HH:mm')
                               : '—'}">01.01.24 15:30</div>
            </div>

            <div class="ap-metric">
                <div class="l">Результат</div>
                <div class="v">
                    <span th:text="${detailedAnswers.summary != null and detailedAnswers.summary.correctAnswers != null
                                   ? detailedAnswers.summary.correctAnswers : 0}">0</span><small> / </small><span
                        th:text="${detailedAnswers.summary != null and detailedAnswers.summary.totalQuestions != null
                                 ? detailedAnswers.summary.totalQuestions : 0}">0</span>
                </div>
            </div>

            <div class="ap-metric">
                <div class="l">Процент</div>
                <div class="v">
                    <span th:text="${#numbers.formatDecimal(detailedAnswers.summary != null and detailedAnswers.summary.percentage != null
                                   ? detailedAnswers.summary.percentage : 0, 1, 1)}">0,0</span><small>%</small>
                </div>
            </div>

            <div class="ap-metric">
                <div class="l">Длительность</div>
                <div class="v" style="font-size:18px"
                     th:text="${detailedAnswers.formattedDuration != null ? detailedAnswers.formattedDuration : '—'}">15 мин</div>
            </div>

        </div>

        <!-- Разбор ответов -->
        <div class="ap-card" style="margin-bottom:24px">

            <div class="ap-card-head">
                <h3>Ответы на вопросы</h3>
                <span class="ap-xs ap-muted ap-mono"
                      th:text="${(detailedAnswers.questionAnswers != null ? #lists.size(detailedAnswers.questionAnswers) : 0) + ' вопросов'}">0 вопросов</span>
            </div>

            <div class="ap-card-body">

                <div th:if="${detailedAnswers.questionAnswers == null or #lists.isEmpty(detailedAnswers.questionAnswers)}"
                     class="ap-empty">
                    <svg th:replace="~{fragments/icons :: i-info}"></svg>
                    <div>Нет данных для разбора ответов.</div>
                </div>

                <div class="ap-row" th:each="answer, stat : ${detailedAnswers.questionAnswers}">

                    <div style="display:flex;gap:12px;align-items:flex-start;min-width:0">

                        <span th:if="${answer.isCorrect}"
                              style="display:inline-flex;width:20px;height:20px;flex-shrink:0;overflow:hidden;color:#16a34a;margin-top:2px">
                            <svg th:replace="~{fragments/icons :: i-check}"></svg>
                        </span>

                        <span th:unless="${answer.isCorrect}"
                              style="display:inline-flex;width:20px;height:20px;flex-shrink:0;overflow:hidden;color:#dc2626;margin-top:2px">
                            <svg th:replace="~{fragments/icons :: i-x}"></svg>
                        </span>

                        <div style="min-width:0">
                            <div class="ap-title"
                                 th:text="${stat.count} + '. ' + ${answer.questionText}">1. Текст вопроса</div>

                            <div class="ap-meta">
                                <span>Ответ:</span>
                                <span th:text="${answer.chosenAnswer != null and answer.chosenAnswer.answerText != null
                                               ? answer.chosenAnswer.answerText
                                               : 'Ответ не предоставлен'}">Вариант</span>
                            </div>

                            <div class="ap-meta" th:unless="${answer.isCorrect}">
                                <span>Правильный:</span>
                                <span th:text="${answer.correctAnswer != null and answer.correctAnswer.answerText != null
                                               ? answer.correctAnswer.answerText
                                               : '—'}">Вариант</span>
                            </div>
                        </div>

                    </div>

                    <div>
                        <span class="ap-tag ap-ok" th:if="${answer.isCorrect}">Верно</span>
                        <span class="ap-tag ap-bad" th:unless="${answer.isCorrect}">Ошибка</span>
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:inline="javascript">
    document.getElementById('exportPdfButton').addEventListener('click', async function() {
        const button = this;
        const statusDiv = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        // Берём attemptId из модели, переданной в шаблон
        const attemptId = /*[[${detailedAnswers.attemptId}]]*/ 0;
        const testId = /*[[${test.id}]]*/ 0;

        button.disabled = true;
        statusDiv.style.display = 'flex';
        statusText.textContent = 'Запрос отправлен...';

        try {
            const response = await fetch('/manager/tests/' + testId + '/statistics/tester/' + attemptId + '/export', {
                credentials: 'same-origin'
            });

            if (!response.ok) throw new Error('Ошибка сервера');

            const data = await response.json();
            const requestId = data.requestId;
            statusText.textContent = data.message || 'Генерация PDF...';

            const checkInterval = setInterval(async () => {
                const res = await fetch('/export/download/' + requestId, {
                    credentials: 'same-origin'
                });
                if (res.ok) {
                    clearInterval(checkInterval);
                    const blob = await res.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'detailed_answers_attempt_' + attemptId + '.pdf';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                    statusText.textContent = 'Скачивание началось.';
                    button.disabled = false;
                } else if (res.status === 404) {
                    statusText.textContent = 'Формирование PDF...';
                } else {
                    clearInterval(checkInterval);
                    statusText.textContent = 'Ошибка получения отчёта.';
                    button.disabled = false;
                }
            }, 2000);
        } catch (error) {
            statusText.textContent = 'Ошибка: ' + error.message;
            button.disabled = false;
        }
    });
</script>
</body>
</html>
