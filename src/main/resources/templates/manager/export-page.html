<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headerModern('Экспорт статистики')}"></head>
<body>

<div class="ap-page ap-shell">

    <div class="ap-overlay" id="apOverlay"></div>

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('MANAGER', 'statistics')}"></aside>

    <main class="ap-main">

        <!-- Action bar -->
        <div th:replace="~{fragments/appbar :: appbar('', '', '')}"></div>

        <!-- Хлебные крошки -->
        <nav class="ap-crumbs" aria-label="Хлебные крошки">
            <a th:href="@{/manager/dashboard}">Обзор</a>
            <span class="sep">/</span>
            <span class="cur">Экспорт</span>
        </nav>

        <!-- Page head -->
        <div class="ap-page-head">
            <h1 th:text="'Экспорт статистики: ' + ${test.title}">Экспорт статистики</h1>
            <p>Выберите параметры отчёта и сформируйте PDF</p>
        </div>

        <div class="ap-card" style="max-width:760px">

            <div class="ap-card-head">
                <h3>Параметры отчёта</h3>
            </div>

            <div class="ap-card-body" style="padding:20px 22px 22px">

                <form id="exportForm"
                      th:action="@{/manager/tests/{testId}/statistics/export(testId=${test.id})}"
                      method="post">

                    <div class="ap-form-grid">

                        <!-- Тестировщик -->
                        <div class="ap-field">
                            <label class="ap-label" for="exportTesterUsername">Тестировщик</label>
                            <select class="ap-select" id="exportTesterUsername" name="testerUsername">
                                <option value="">Все тестировщики</option>
                                <option th:each="tester : ${testers}"
                                        th:value="${tester.username}"
                                        th:text="${tester.fullName} + ' (' + ${tester.username} + ')'">
                                </option>
                            </select>
                        </div>

                        <!-- Категория -->
                        <div class="ap-field">
                            <label class="ap-label" for="exportCategoryId">Категория</label>
                            <select class="ap-select" id="exportCategoryId" name="categoryId">
                                <option value="">Все категории</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">
                                </option>
                            </select>
                        </div>

                        <!-- Дата с -->
                        <div class="ap-field">
                            <label class="ap-label" for="exportDateFrom">Дата с</label>
                            <input type="date" class="ap-input" id="exportDateFrom" name="dateFrom">
                        </div>

                        <!-- Дата по -->
                        <div class="ap-field">
                            <label class="ap-label" for="exportDateTo">Дата по</label>
                            <input type="date" class="ap-input" id="exportDateTo" name="dateTo">
                        </div>

                        <!-- Включить в отчёт -->
                        <div class="ap-field ap-span-2">
                            <span class="ap-label">Включить в отчет</span>
                            <div class="ap-cluster" style="gap:20px">
                                <label class="ap-check" for="includeCorrect">
                                    <input type="checkbox" id="includeCorrect" name="includeCorrect"
                                           value="true" checked>
                                    <span>Правильные ответы</span>
                                </label>
                                <label class="ap-check" for="includeIncorrect">
                                    <input type="checkbox" id="includeIncorrect" name="includeIncorrect"
                                           value="true" checked>
                                    <span>Неправильные ответы</span>
                                </label>
                            </div>
                        </div>

                        <!-- Статусное сообщение -->
                        <div class="ap-span-2">
                            <div id="statusMessage" class="ap-alert" role="status"
                                 style="background:#f4f4f5;border-color:#ececec;color:#0f0f0f;margin-bottom:0;display:none">
                                <svg th:replace="~{fragments/icons :: i-info}"></svg>
                                <span id="statusText"></span>
                            </div>
                        </div>

                        <!-- Действия -->
                        <div class="ap-span-2">
                            <hr>
                            <div class="ap-cluster">
                                <button type="button" id="exportButton" class="ap-btn ap-btn-dark">
                                    <svg th:replace="~{fragments/icons :: i-download}"></svg>
                                    Сгенерировать PDF
                                </button>
                                <a th:href="@{/manager/dashboard}" class="ap-btn ap-btn-outline">
                                    <svg th:replace="~{fragments/icons :: i-chevron-left}"></svg>
                                    Отмена
                                </a>
                            </div>
                        </div>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/assesspro-ui.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script>
    document.getElementById('exportButton').addEventListener('click', async function() {
        const form = document.getElementById('exportForm');
        const button = this;
        const statusDiv = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        // Собираем данные формы (можно отправить POST с JSON или URLSearchParams)
        const formData = new URLSearchParams(new FormData(form));
        const url = form.action; // /manager/tests/{testId}/statistics/export

        button.disabled = true;
        statusDiv.style.display = 'flex';
        statusText.textContent = 'Запрос отправлен...';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });
            if (!response.ok) throw new Error('Ошибка сервера');
            const data = await response.json();
            const requestId = data.requestId;
            statusText.textContent = data.message;

            const checkInterval = setInterval(async () => {
                const res = await fetch('/export/download/' + requestId);
                if (res.ok) {
                    clearInterval(checkInterval);
                    const blob = await res.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'manager_report.pdf';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                    statusText.textContent = 'Скачивание началось.';
                    button.disabled = false;
                } else if (res.status === 404) {
                    statusText.textContent = 'Генерация PDF...';
                } else {
                    clearInterval(checkInterval);
                    statusText.textContent = 'Ошибка получения отчёта.';
                    button.disabled = false;
                }
            }, 2000);
        } catch (error) {
            statusText.textContent = 'Ошибка: ' + error.message;
            button.disabled = false;
        }
    });
</script>
</body>
</html>
